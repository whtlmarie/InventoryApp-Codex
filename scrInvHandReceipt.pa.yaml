                              AccessibleLabel: =Self.Text
                              Align: =Align.Center
                              Color: =RGBA(0, 0, 0, 1)
                              Height: =20
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingTop: =0
                              Size: =10
                              Text: ="Equipment currently issued to the person named below (summary of their DAF Form 1297 receipts)"
                        - conInvHrGap1:
