Screens:
  scrInvHandReceipt:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      OnVisible: |-
        =UpdateContext({locPrinting: false, locPrintA: false, locPrintB: false})
    Children:
      - conInvHrRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conInvHrBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(15, 76, 129, 1)
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =!locPrinting
                Children:
                  - btnInvHrBack:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Back to People"
                        Appearance: =ButtonAppearance.Secondary
                        Height: =36
                        Icon: ="ArrowLeft"
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scrInvPerson, ScreenTransition.None)
                        Text: ="Back to People"
                        Width: =170
                  - txtInvHrBarTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =16
                        Text: |-
                          ="Hand receipt: " & Coalesce(gblInvPersonName, gblInvPersonEmail)
                        Wrap: =false
                  - btnInvHrPrint:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Print the hand receipt"
                        Height: =36
                        Icon: ="Print"
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =UpdateContext({locPrinting: true, locPrintA: true})
                        Text: ="Print"
                        Width: =120
            - tmrInvHrA:
                Control: Timer
                Properties:
                  Duration: =400
                  Height: =1
                  OnTimerEnd: |-
                    =UpdateContext({locPrintA: false}); Print(); UpdateContext({locPrintB: true})
                  Start: =locPrintA
                  Visible: =false
                  Width: =1
            - tmrInvHrB:
                Control: Timer
                Properties:
                  Duration: =1500
                  Height: =1
                  OnTimerEnd: |-
                    =UpdateContext({locPrintB: false, locPrinting: false})
                  Start: =locPrintB
                  Visible: =false
                  Width: =1
            - conInvHrBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =If(locPrinting, RGBA(255, 255, 255, 1), RGBA(245, 246, 248, 1))
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conInvHrPaper:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(locPrinting, DropShadow.None, DropShadow.Semilight)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =24 + 34 + 20 + 12 + 52 + 52 + 12 + 30 + galInvHrRows.Height + 28 + 56 + 12 + 40 + 24
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =24
                        PaddingLeft: =32
                        PaddingRight: =32
                        PaddingTop: =24
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Min(Parent.Width - 32, 1100)
                      Children:
                        - txtInvHrTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Align: =Align.Center
                              Color: =RGBA(0, 0, 0, 1)
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingTop: =0
                              Size: =18
                              Text: ="EQUIPMENT HAND RECEIPT"
                        - txtInvHrSub:
                            Control: ModernText
