Screens:
  scrInvAsset:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
      LoadingSpinnerColor: =RGBA(15, 76, 129, 1)
      OnVisible: |-
        =UpdateContext({locNew: gblInvAssetId = 0, locEdit: gblInvAssetId = 0, locBusy: false, locIncOpen: false});
        Select(btnInvAsdLoad)
    Children:
      - conInvAsdRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conInvAsdHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(15, 76, 129, 1)
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =56
                  LayoutMinWidth: =0
                  PaddingLeft: =8
                  PaddingRight: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnInvAsdNavToggle:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        Icon: ="Navigation"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinWidth: =40
                        OnSelect: =Set(varNavCollapsed, !varNavCollapsed)
                        Text: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Tooltip: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Width: =40
                  - txtInvAsdAppTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Inventory"
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinWidth: =120
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Inventory"
                        Wrap: =false
                  - txtInvAsdUserName:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Signed in as " & User().FullName
                        Align: =Align.Right
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =User().FullName
                        Visible: =App.Width >= 640
                        Width: =240
                        Wrap: =false
            - conInvAsdBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conInvAsdNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(varNavCollapsed, 56, 240)
                      Children:
                        - galInvAsdNav:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Main navigation"
                              FillPortions: =0
                              Height: =CountRows(fxInvVisibleNav) * 46
                              Items: =fxInvVisibleNav
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TabIndex: =0
                              TemplatePadding: =2
                              TemplateSize: =44
                            Children:
                              - conInvAsdNavRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.Id = "assets", RGBA(230, 240, 250, 1), RGBA(0, 0, 0, 0))
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - btnInvAsdNavItem:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =ThisItem.Label
                                          Align: =If(varNavCollapsed, Align.Center, Align.Left)
                                          Appearance: =ButtonAppearance.Subtle
                                          Color: =If(ThisItem.Id = "assets", RGBA(15, 76, 129, 1), RGBA(36, 36, 36, 1))
                                          FillPortions: =1
                                          FontWeight: =If(ThisItem.Id = "assets", FontWeight.Semibold, FontWeight.Normal)
                                          Height: =40
                                          Icon: =ThisItem.Icon
                                          IconStyle: =If(ThisItem.Id = "assets", IconStyle.Filled, IconStyle.Outline)
                                          Layout: =If(varNavCollapsed, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                                          LayoutMinWidth: =40
                                          OnSelect: =Navigate(ThisItem.Target, ScreenTransition.None)
                                          Text: =ThisItem.Label
                                          Tooltip: =ThisItem.Label
                  - conInvAsdMain:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =If(App.Width >= 800, 32, 16)
                        PaddingRight: =If(App.Width >= 800, 32, 16)
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnInvAsdReload:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Reload inventory data"
                              Height: =36
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =// Inventory data for all screens (whole lists; fine at the current volume).
                                Set(gblInvLoading, true);
                                Refresh(InventoryAssets);
                                Refresh(InventoryCheckouts);
                                Refresh(InventoryReservations);
                                Refresh(InventoryReceipts);
                                Set(gblInvAssets, AddColumns(ForAll(InventoryAssets, ThisRecord), Dept, Department.Value, Status, AssetStatus.Value, Kind, AssetKind.Value));
                                Set(gblInvOpenCheckouts, AddColumns(Filter(InventoryCheckouts, CheckoutStatus.Value = "Active" || CheckoutStatus.Value = "Awaiting Acknowledgement" || CheckoutStatus.Value = "Return Required"), Status, CheckoutStatus.Value));
                                Set(gblInvReserved, Filter(InventoryReservations, ReservationStatus.Value = "Reserved"));
                                Set(gblInvLines, Filter(RequestEquipment, NeedsInventoryAction = true));
                                Set(gblInvLoadedAt, Now());
                                Set(gblInvLoading, false)
                              Text: ="Reload"
                              Visible: =false
                              Width: =10
                        - btnInvAsdLoad:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Load asset"
                              Height: =36
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =// Asset, its open checkout, reservations and history (re-run after every change).
                                UpdateContext({locAsset: If(gblInvAssetId > 0, LookUp(InventoryAssets, ID = gblInvAssetId))});
                                UpdateContext({
                                    locCheckout: If(Coalesce(locAsset.CurrentCheckoutId, 0) > 0, LookUp(InventoryCheckouts, ID = locAsset.CurrentCheckoutId)),
                                    locRes: Filter(InventoryReservations, AssetId = gblInvAssetId && ReservationStatus.Value = "Reserved"),
                                    locHist: Sort(Filter(InventoryHistory, AssetId = gblInvAssetId), Created, SortOrder.Descending)
                                });
                                Reset(txtInvAsdTag); Reset(txtInvAsdMake); Reset(txtInvAsdModel); Reset(txtInvAsdHome); Reset(txtInvAsdNotes);
                                Reset(drpInvAsdDept); Reset(drpInvAsdCatalog); Reset(drpInvAsdKind); Reset(drpInvAsdCond); Reset(dteInvAsdPurchase); Reset(dteInvAsdWarranty)
                              Text: ="Load"
                              Visible: =false
                              Width: =10
                        - conInvAsdTop:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - btnInvAsdBack:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Back to all assets"
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =36
                                    Icon: ="ArrowLeft"
                                    LayoutMinWidth: =0
                                    OnSelect: =Navigate(scrInvAssets, ScreenTransition.None)
                                    Text: ="All assets"
                                    Width: =140
                        - conInvAsdTitleRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =64
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conInvAsdTitles:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvAsdPageTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Bold
                                          Height: =36
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =24
                                          Text: =If(locNew, "Add asset", locAsset.Title)
                                          Wrap: =false
                                    - txtInvAsdPageSubtitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =If(locNew, "Scan the label into the asset tag box, then fill in the details.", Coalesce(locAsset.CatalogNameSnapshot, "Not linked to a catalog item") & "  ·  " & locAsset.Department.Value & "  ·  " & locAsset.AssetKind.Value)
                                          Wrap: =false
                              - txtInvAsdTopStatus:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =fxStatusColor(locAsset.AssetStatus.Value)
                                    Fill: =fxStatusFill(locAsset.AssetStatus.Value)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Size: =12
                                    Text: =locAsset.AssetStatus.Value
                                    Width: =120
                                    Wrap: =false
                              - btnInvAsdRefresh:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Refresh this asset"
                                    Appearance: =ButtonAppearance.Secondary
                                    DisplayMode: =If(locBusy, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    LayoutMinWidth: =0
                                    OnSelect: =Refresh(InventoryAssets); Refresh(InventoryHistory); Refresh(InventoryReservations); Refresh(InventoryCheckouts); Refresh(InventoryAssetFiles); Refresh(InventoryIncidents); Set(gblInvLoadedAt, Blank()); Select(btnInvAsdLoad)
                                    Text: ="Refresh"
                                    Visible: =!locNew
                                    Width: =120
                        - conInvAsdCols:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: |-
                                =With({l: conInvAsdDetails.Height + If(locNew, 0, 16 + conInvAsdFiles.Height), r: If(locNew, 0, conInvAsdStatus.Height + 16 + If(conInvAsdIncs.Visible, conInvAsdIncs.Height + 16, 0) + conInvAsdRes.Height + 16 + conInvAsdHist.Height)}, If(App.Width >= 1250, Max(l, r), l + 16 + r))
                              LayoutAlignItems: =If(App.Width >= 1250, LayoutAlignItems.Start, LayoutAlignItems.Stretch)
                              LayoutDirection: =If(App.Width >= 1250, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =fxCanViewInventory && (locNew || !IsBlank(locAsset))
                            Children:
                              - conInvAsdLeft:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =If(App.Width >= 1250, 3, 0)
                                    Height: =conInvAsdDetails.Height + If(locNew, 0, 16 + conInvAsdFiles.Height)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - conInvAsdDetails:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.Semilight
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =20 + 48 + 12 + 5 * (If(App.Width >= 700, 60, 128) + 12) + 96 + 12 + 40 + 24
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =12
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =24
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          PaddingTop: =20
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - conInvAsdDetailsHead:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =48
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - txtInvAsdDetailsTitle:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =RGBA(36, 36, 36, 1)
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =26
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingTop: =0
                                                      Size: =16
                                                      Text: =If(locNew, "New asset", "Details")
                                                - txtInvAsdDetailsDesc:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =RGBA(97, 97, 97, 1)
                                                      Height: =20
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingTop: =0
                                                      Size: =12
                                                      Text: =If(locEdit, "The asset tag is the serial number and must be unique. Link it to its catalog item so it can fill requests.", "What this unit is and where it lives.")
                                                      Wrap: =false
                                          - conInvAsdR1:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =If(App.Width >= 700, 60, 128)
                                                LayoutDirection: =If(App.Width >= 700, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                                LayoutGap: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - conInvAsdFTag:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =60
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =160
                                                    Children:
                                                      - txtInvAsdFTagLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            Color: =RGBA(66, 66, 66, 1)
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =20
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =13
                                                            Text: ="Asset tag / Serial number"
                                                      - txtInvAsdTag:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            AccessibleLabel: ="Asset tag or serial number"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Default: =locAsset.Title
                                                            DisplayMode: =If(locEdit, DisplayMode.Edit, DisplayMode.View)
                                                            Height: =36
                                                            LayoutMinWidth: =0
                                                            Placeholder: ="Scan or type the label"
                                                            Width: =Parent.Width
                                                - conInvAsdFDept:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =60
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =160
                                                    Children:
                                                      - txtInvAsdFDeptLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            Color: =RGBA(66, 66, 66, 1)
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =20
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =13
                                                            Text: ="Department"
                                                      - drpInvAsdDept:
                                                          Control: ModernDropdown
                                                          Properties:
                                                            AccessibleLabel: ="Department"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Default: |-
                                                              =LookUp(If(locEdit, ForAll(fxMyDepts, {Value: Dept}), Table({Value: "AV"}, {Value: "IT"})), Value = Coalesce(locAsset.Department.Value, fxDefaultDept))
                                                            DisplayMode: =If(locEdit, DisplayMode.Edit, DisplayMode.View)
                                                            Height: =36
                                                            ItemDisplayText: =ThisItem.Value
                                                            Items: |-
                                                              =If(locEdit, ForAll(fxMyDepts, {Value: Dept}), Table({Value: "AV"}, {Value: "IT"}))
                                                            LayoutMinWidth: =0
                                                            Width: =Parent.Width
                                          - conInvAsdR2:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =If(App.Width >= 700, 60, 128)
                                                LayoutDirection: =If(App.Width >= 700, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                                LayoutGap: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - conInvAsdFCatalog:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =60
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =160
                                                    Children:
                                                      - txtInvAsdFCatalogLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            Color: =RGBA(66, 66, 66, 1)
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =20
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =13
                                                            Text: ="Catalog item"
                                                      - drpInvAsdCatalog:
                                                          Control: ModernDropdown
                                                          Properties:
                                                            AccessibleLabel: ="Catalog item"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Default: =LookUp(fxInvCatalog, ID = locAsset.CatalogItemId)
                                                            DisplayMode: =If(locEdit, DisplayMode.Edit, DisplayMode.View)
                                                            Height: =36
                                                            ItemDisplayText: =ThisItem.Title
                                                            Items: =Filter(fxInvCatalog, IsBlank(drpInvAsdDept.Selected.Value) || drpInvAsdDept.Selected.Value in Coalesce(DepartmentRoute.Value, ""))
                                                            LayoutMinWidth: =0
                                                            Width: =Parent.Width
                                                - conInvAsdFKind:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =60
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =160
                                                    Children:
                                                      - txtInvAsdFKindLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            Color: =RGBA(66, 66, 66, 1)
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =20
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =13
                                                            Text: ="Kind"
                                                      - drpInvAsdKind:
                                                          Control: ModernDropdown
                                                          Properties:
                                                            AccessibleLabel: ="Kind"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Default: =LookUp(fxAssetKinds, Value = Coalesce(locAsset.AssetKind.Value, If(IsBlank(drpInvAsdCatalog.Selected), "Loaner Pool", drpInvAsdCatalog.Selected.InventoryType.Value)))
                                                            DisplayMode: =If(locEdit, DisplayMode.Edit, DisplayMode.View)
                                                            Height: =36
                                                            ItemDisplayText: =ThisItem.Value
                                                            Items: =fxAssetKinds
                                                            LayoutMinWidth: =0
                                                            Width: =Parent.Width
                                          - conInvAsdR3:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =If(App.Width >= 700, 60, 128)
                                                LayoutDirection: =If(App.Width >= 700, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                                LayoutGap: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - conInvAsdFMake:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =60
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =160
                                                    Children:
                                                      - txtInvAsdFMakeLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            Color: =RGBA(66, 66, 66, 1)
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =20
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =13
                                                            Text: ="Make"
                                                      - txtInvAsdMake:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            AccessibleLabel: ="Make"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Default: =locAsset.Make
                                                            DisplayMode: =If(locEdit, DisplayMode.Edit, DisplayMode.View)
                                                            Height: =36
                                                            LayoutMinWidth: =0
                                                            Width: =Parent.Width
                                                - conInvAsdFModel:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =60
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =160
                                                    Children:
