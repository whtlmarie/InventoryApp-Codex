Screens:
  scrInvCheckout:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
      LoadingSpinnerColor: =RGBA(15, 76, 129, 1)
      OnVisible: |-
        =UpdateContext({locScanMsg: "", locScanMatches: Blank(), locBusy: false});
        If(IsBlank(gblInvLoadedAt) || DateDiff(gblInvLoadedAt, Now(), TimeUnit.Minutes) >= 2, Select(btnInvCoReload))
    Children:
      - conInvCoRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conInvCoHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(15, 76, 129, 1)
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =56
                  LayoutMinWidth: =0
                  PaddingLeft: =8
                  PaddingRight: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnInvCoNavToggle:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        Icon: ="Navigation"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinWidth: =40
                        OnSelect: =Set(varNavCollapsed, !varNavCollapsed)
                        Text: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Tooltip: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Width: =40
                  - txtInvCoAppTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Inventory"
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinWidth: =120
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Inventory"
                        Wrap: =false
                  - txtInvCoUserName:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Signed in as " & User().FullName
                        Align: =Align.Right
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =User().FullName
                        Visible: =App.Width >= 640
                        Width: =240
                        Wrap: =false
            - conInvCoBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conInvCoNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(varNavCollapsed, 56, 240)
                      Children:
                        - galInvCoNav:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Main navigation"
                              FillPortions: =0
                              Height: =CountRows(fxInvVisibleNav) * 46
                              Items: =fxInvVisibleNav
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TabIndex: =0
                              TemplatePadding: =2
                              TemplateSize: =44
                            Children:
                              - conInvCoNavRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.Id = "checkout", RGBA(230, 240, 250, 1), RGBA(0, 0, 0, 0))
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - btnInvCoNavItem:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =ThisItem.Label
                                          Align: =If(varNavCollapsed, Align.Center, Align.Left)
                                          Appearance: =ButtonAppearance.Subtle
                                          Color: =If(ThisItem.Id = "checkout", RGBA(15, 76, 129, 1), RGBA(36, 36, 36, 1))
                                          FillPortions: =1
                                          FontWeight: =If(ThisItem.Id = "checkout", FontWeight.Semibold, FontWeight.Normal)
                                          Height: =40
                                          Icon: =ThisItem.Icon
                                          IconStyle: =If(ThisItem.Id = "checkout", IconStyle.Filled, IconStyle.Outline)
                                          Layout: =If(varNavCollapsed, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                                          LayoutMinWidth: =40
                                          OnSelect: =Navigate(ThisItem.Target, ScreenTransition.None)
                                          Text: =ThisItem.Label
                                          Tooltip: =ThisItem.Label
                  - conInvCoMain:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =If(App.Width >= 800, 32, 16)
                        PaddingRight: =If(App.Width >= 800, 32, 16)
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnInvCoReload:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Reload inventory data"
                              Height: =36
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =// Inventory data for all screens (whole lists; fine at the current volume).
                                Set(gblInvLoading, true);
                                Refresh(InventoryAssets);
                                Refresh(InventoryCheckouts);
                                Refresh(InventoryReservations);
                                Refresh(InventoryReceipts);
                                Set(gblInvAssets, AddColumns(ForAll(InventoryAssets, ThisRecord), Dept, Department.Value, Status, AssetStatus.Value, Kind, AssetKind.Value));
                                Set(gblInvOpenCheckouts, AddColumns(Filter(InventoryCheckouts, CheckoutStatus.Value = "Active" || CheckoutStatus.Value = "Awaiting Acknowledgement" || CheckoutStatus.Value = "Return Required"), Status, CheckoutStatus.Value));
                                Set(gblInvReserved, Filter(InventoryReservations, ReservationStatus.Value = "Reserved"));
                                Set(gblInvLines, Filter(RequestEquipment, NeedsInventoryAction = true));
                                Set(gblInvLoadedAt, Now());
                                Set(gblInvLoading, false)
                              Text: ="Reload"
                              Visible: =false
                              Width: =10
                        - conInvCoPageHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =64
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conInvCoTitles:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvCoPageTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Bold
                                          Height: =36
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =24
                                          Text: ="Checkout"
                                          Wrap: =false
                                    - txtInvCoPageSubtitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="Issue equipment to one person. Everything issued together goes on one DAF Form 1297 receipt."
                                          Wrap: =false
                              - txtInvCoUpdated:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Right
                                    Color: =RGBA(97, 97, 97, 1)
                                    Height: =20
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =If(gblInvLoading, "Loading…", If(IsBlank(gblInvLoadedAt), "", "Updated " & Text(gblInvLoadedAt, "h:mm AM/PM")))
                                    Visible: =App.Width >= 900
                                    Width: =120
                                    Wrap: =false
                              - btnInvCoRefresh:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Refresh"
                                    Appearance: =ButtonAppearance.Secondary
                                    DisplayMode: =If(gblInvLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnInvCoReload)
                                    Text: ="Refresh"
                                    Width: =120
                        - conInvCoDone:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =If(locCoDone.Ok, RGBA(16, 110, 16, 1), RGBA(164, 38, 44, 1))
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(locCoDone.Ok, RGBA(223, 246, 221, 1), RGBA(253, 231, 233, 1))
                              FillPortions: =0
                              Height: =88
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Visible: =!IsBlank(locCoDone)
                            Children:
                              - txtInvCoDone:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =If(locCoDone.Ok, RGBA(16, 110, 16, 1), RGBA(164, 38, 44, 1))
                                    FillPortions: =1
                                    Height: =80
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: |-
                                      =locCoDone.Message & If(IsEmpty(locCoDone.Failed), "", "  Not issued: " & Concat(locCoDone.Failed, Tag & " (" & Message & ")", "; "))
                        - conInvCoCols:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(App.Width >= 1500, Max(conInvCoWho.Height + 16 + conInvCoWhen.Height, conInvCoItems.Height), conInvCoWho.Height + 16 + conInvCoWhen.Height + 16 + conInvCoItems.Height)
                              LayoutAlignItems: =If(App.Width >= 1500, LayoutAlignItems.Start, LayoutAlignItems.Stretch)
                              LayoutDirection: =If(App.Width >= 1500, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =fxIsInvStaff
                            Children:
                              - conInvCoLeft:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =If(App.Width >= 1500, 1, 0)
                                    Height: =conInvCoWho.Height + 16 + conInvCoWhen.Height
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - conInvCoWho:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.Semilight
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =20 + 48 + 12 + 2 * (If(App.Width >= 900, 60, 136) + 12) + 24
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =12
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =24
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          PaddingTop: =20
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - conInvCoWhoHead:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =48
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - txtInvCoWhoTitle:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =RGBA(36, 36, 36, 1)
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =26
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingTop: =0
                                                      Size: =16
                                                      Text: ="1. Who is receiving it"
                                                - txtInvCoWhoDesc:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =RGBA(97, 97, 97, 1)
                                                      Height: =20
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingTop: =0
                                                      Size: =12
                                                      Text: ="They acknowledge by approval in Outlook or Teams."
                                                      Wrap: =false
                                          - conInvCoR1:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =If(App.Width >= 900, 60, 136)
                                                LayoutDirection: =If(App.Width >= 900, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                                LayoutGap: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - conInvCoFPerson:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =60
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =160
                                                    Children:
                                                      - txtInvCoFPersonLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            Color: =RGBA(66, 66, 66, 1)
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =20
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =13
                                                            Text: ="Issued to"
                                                      - cmbInvCoPerson:
                                                          Control: ModernCombobox
                                                          Properties:
                                                            AccessibleLabel: ="Person receiving the equipment"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            DelayOutput: =true
                                                            Height: =36
                                                            InputTextPlaceholder: ="Search by name or email"
                                                            ItemDisplayText: =ThisItem.DisplayName & "  (" & ThisItem.Mail & ")"
                                                            Items: |-
                                                              =If(
                                                                  Len(Trim(cmbInvCoPerson.SearchText)) >= 2,
                                                                  Filter(
                                                                      Office365Users.SearchUserV2({searchTerm: Trim(cmbInvCoPerson.SearchText), top: 15, isSearchTermRequired: true}).value,
                                                                      AccountEnabled && !IsBlank(Mail)
                                                                  )
                                                              )
                                                            LayoutMinWidth: =0
                                                            SelectMultiple: =false
                                                            Width: =Parent.Width
                                                - conInvCoFPhone:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =60
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =160
                                                    Children:
                                                      - txtInvCoFPhoneLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            Color: =RGBA(66, 66, 66, 1)
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =20
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =13
                                                            Text: ="Duty phone"
                                                      - txtInvCoPhone:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            AccessibleLabel: ="Duty phone"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Default: =If(IsBlank(cmbInvCoPerson.Selected), "", Coalesce(First(cmbInvCoPerson.Selected.BusinessPhones).Value, cmbInvCoPerson.Selected.mobilePhone, ""))
                                                            Height: =36
                                                            LayoutMinWidth: =0
                                                            Placeholder: ="From their profile"
                                                            Width: =Parent.Width
                                          - conInvCoR2:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =If(App.Width >= 900, 60, 136)
                                                LayoutDirection: =If(App.Width >= 900, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                                LayoutGap: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - conInvCoFDept:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =60
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =160
                                                    Children:
                                                      - txtInvCoFDeptLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            Color: =RGBA(66, 66, 66, 1)
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =20
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =13
                                                            Text: ="Department"
                                                      - drpInvCoDept:
                                                          Control: ModernDropdown
                                                          Properties:
                                                            AccessibleLabel: ="Department issuing the equipment"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Default: |-
                                                              =First(ForAll(fxMyDepts, {Value: Dept}))
                                                            Height: =36
                                                            ItemDisplayText: =ThisItem.Value
                                                            Items: |-
                                                              =ForAll(fxMyDepts, {Value: Dept})
                                                            LayoutMinWidth: =0
                                                            OnChange: |-
                                                              =Clear(colInvCoItems); UpdateContext({locScanMsg: ""})
                                                            Width: =Parent.Width
                                                - conInvCoFAcct:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =60
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =160
                                                    Children:
                                                      - txtInvCoFAcctLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            Color: =RGBA(66, 66, 66, 1)
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =20
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =13
                                                            Text: ="Orgn acct no."
                                                      - txtInvCoAcct:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: ="Organization account number, " & Self.Text
                                                            Color: =RGBA(36, 36, 36, 1)
                                                            Height: =36
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =14
                                                            Text: =Switch(drpInvCoDept.Selected.Value, "IT", "TSOS", "AV", "TSAV", "")
                                    - conInvCoWhen:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.Semilight
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =20 + 48 + 12 + 2 * (If(App.Width >= 900, 60, 136) + 12) + 24
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =12
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =24
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          PaddingTop: =20
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - conInvCoWhenHead:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =48
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - txtInvCoWhenTitle:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =RGBA(36, 36, 36, 1)
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =26
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingTop: =0
                                                      Size: =16
                                                      Text: ="2. Loan or assignment"
                                                - txtInvCoWhenDesc:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =RGBA(97, 97, 97, 1)
                                                      Height: =20
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingTop: =0
                                                      Size: =12
                                                      Text: =If(drpInvCoType.Selected.Value = "Long-term Assignment", "Kept until turned in. No return date.", "Temporary loan. The return date prints on the receipt.")
                                                      Wrap: =false
                                          - conInvCoR3:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =If(App.Width >= 900, 60, 136)
                                                LayoutDirection: =If(App.Width >= 900, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                                LayoutGap: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - conInvCoFType:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =60
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =160
                                                    Children:
                                                      - txtInvCoFTypeLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            Color: =RGBA(66, 66, 66, 1)
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =20
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =13
                                                            Text: ="Type"
                                                      - drpInvCoType:
                                                          Control: ModernDropdown
                                                          Properties:
                                                            AccessibleLabel: ="Type of checkout"
                                                            AlignInContainer: =AlignInContainer.Stretch
