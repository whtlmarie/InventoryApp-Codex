                            Children:
                              - txtInvCoMissing:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =If(!IsBlank(cmbInvCoPerson.Selected) && !IsEmpty(colInvCoItems) && !IsBlank(drpInvCoDept.Selected) && (drpInvCoType.Selected.Value = "Long-term Assignment" || !IsBlank(dteInvCoReturn.SelectedDate)), RGBA(16, 110, 16, 1), RGBA(97, 97, 97, 1))
                                    FillPortions: =1
                                    Height: =40
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: |-
                                      =If(!IsBlank(cmbInvCoPerson.Selected) && !IsEmpty(colInvCoItems) && !IsBlank(drpInvCoDept.Selected) && (drpInvCoType.Selected.Value = "Long-term Assignment" || !IsBlank(dteInvCoReturn.SelectedDate)), "Ready. Issue creates one receipt for all " & CountRows(colInvCoItems) & If(CountRows(colInvCoItems) = 1, " item.", " items."), "Still needed: " & Concat(
                                          Filter(
                                              Table(
                                                  {T: "the person receiving it", Show: IsBlank(cmbInvCoPerson.Selected)},
                                                  {T: "a return date", Show: !(drpInvCoType.Selected.Value = "Long-term Assignment") && IsBlank(dteInvCoReturn.SelectedDate)},
                                                  {T: "at least one item", Show: IsEmpty(colInvCoItems)}
                                              ),
                                              Show
                                          ),
                                          T,
                                          ", "
                                      ))
                              - spnInvCoBusy:
                                  Control: ModernSpinner
                                  Properties:
                                    AccessibleLabel: ="Issuing"
                                    LayoutMinWidth: =0
                                    Visible: =locBusy
                              - btnInvCoClear:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Start over"
                                    Appearance: =ButtonAppearance.Secondary
                                    DisplayMode: =If(locBusy, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Clear(colInvCoItems); Reset(cmbInvCoPerson); Reset(txtInvCoPhone); UpdateContext({locCoDone: Blank(), locScanMsg: ""})
                                    Text: ="Start over"
                                    Width: =130
                              - btnInvCoIssue:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    DisplayMode: =If(locBusy || !(!IsBlank(cmbInvCoPerson.Selected) && !IsEmpty(colInvCoItems) && !IsBlank(drpInvCoDept.Selected) && (drpInvCoType.Selected.Value = "Long-term Assignment" || !IsBlank(dteInvCoReturn.SelectedDate))), DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    Icon: ="Send"
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =// One receipt per handover: start it, issue each scanned item, then finish it (Inventory - Action flow).
                                      UpdateContext({locBusy: true, locCoDone: Blank()});
                                      IfError(
                                          With(
                                              {start: ParseJSON('Inventory-Action'.Run(fxInvStartReceiptPayload(
                                                  Lower(cmbInvCoPerson.Selected.Mail), cmbInvCoPerson.Selected.DisplayName, "i:0#.f|membership|" & Lower(cmbInvCoPerson.Selected.UserPrincipalName),
                                                  Trim(txtInvCoPhone.Text), txtInvCoAcct.Text,
                                                  If(drpInvCoType.Selected.Value = "Long-term Assignment", "", Text(dteInvCoReturn.SelectedDate, "yyyy-mm-dd")), drpInvCoType.Selected.Value, drpInvCoDept.Selected.Value, drpInvCoSign.Selected.Value
                                              )).response)},
                                              If(
                                                  Text(start.status) <> "Success",
                                                  UpdateContext({locCoDone: {Ok: false, Number: "", Message: Text(start.message), Issued: 0, Failed: FirstN(Table({Tag: "", Ok: true, Message: ""}), 0)}}),
                                                  With(
                                                      {rid: Value(start.id), num: Text(start.number)},
                                                      With(
                                                          {results: ForAll(colInvCoItems As it, With({r: ParseJSON('Inventory-Action'.Run(fxInvIssuePayload(rid, it.ID, 0)).response)}, {Tag: it.Title, Ok: Text(r.status) = "Success", Message: Text(r.message)}))},
                                                          With(
                                                              {finish: ParseJSON('Inventory-Action'.Run(fxInvFinishPayload(rid)).response)},
                                                              UpdateContext({locCoDone: {
                                                                  Ok: CountRows(Filter(results, Ok)) > 0, Number: If(CountRows(Filter(results, Ok)) > 0, num, ""),
                                                                  Message: Text(finish.message), Issued: CountRows(Filter(results, Ok)), Failed: Filter(results, !Ok)
                                                              }})
                                                          )
                                                      )
                                                  )
                                              )
                                          ),
                                          UpdateContext({locCoDone: {Ok: false, Number: "", Message: "The inventory service could not be reached. Check Loans before trying again.", Issued: 0, Failed: FirstN(Table({Tag: "", Ok: true, Message: ""}), 0)}})
                                      );
                                      UpdateContext({locBusy: false});
                                      If(
                                          locCoDone.Ok,
                                          Notify(locCoDone.Message, NotificationType.Success);
                                          Clear(colInvCoItems); Reset(cmbInvCoPerson); Reset(txtInvCoPhone); Reset(drpInvCoSign); Set(gblInvLoadedAt, Blank()); Select(btnInvCoReload),
                                          Notify(locCoDone.Message, NotificationType.Error)
                                      )
