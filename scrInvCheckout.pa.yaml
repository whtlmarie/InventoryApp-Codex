                                                            FillPortions: =1
                                                            FocusedBorderThickness: =0
                                                            HintText: ="Scan, or type all or part of the asset tag / serial number"
                                                            LayoutMinWidth: =100
                                                            OnChange: |-
                                                              =With(
                                                                  {code: Lower(Trim(Self.Text))},
                                                                  If(
                                                                      !IsBlank(code),
                                                                      With(
                                                                          {exact: Coalesce(LookUp(gblInvAssets, Lower(Title) = code), LookUp(gblInvAssets, Lower(Coalesce(SerialNumber, "")) = code))},
                                                                          If(
                                                                              !IsBlank(exact),
                                                                              UpdateContext({locScanMsg: "", locScanMatches: Blank()});
                                                                              With({hit: exact}, If(
                                                                  hit.ID in colInvCoItems.ID, UpdateContext({locScanMsg: hit.Title & " is already on this receipt."}),
                                                                  hit.Status <> "Available", UpdateContext({locScanMsg: hit.Title & " is " & hit.Status & " and can't be issued."}),
                                                                  hit.Dept <> drpInvCoDept.Selected.Value, UpdateContext({locScanMsg: hit.Title & " is " & hit.Dept & " equipment. This receipt is for " & drpInvCoDept.Selected.Value & "."}),
                                                                  !fxCanManage(hit.Dept), UpdateContext({locScanMsg: "You can only issue " & Concat(fxMyDepts, Dept, " or ") & " equipment."}),
                                                                  Collect(colInvCoItems, hit)
                                                              )),
                                                                              With(
                                                                                  {m: FirstN(SortByColumns(Filter(gblInvAssets, code in Lower(Title) || code in Lower(Coalesce(SerialNumber, ""))), "Title"), 6)},
