                                                FillPortions: =1
                                                Height: =20
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingTop: =0
                                                Size: =12
                                                Text: =Coalesce(ThisItem.CatalogNameSnapshot, "No catalog item") & If(IsBlank(Trim(ThisItem.Make & ThisItem.Model)), "", "  ·  " & Trim(ThisItem.Make & " " & ThisItem.Model)) & If(IsBlank(ThisItem.HomeLocation), "", "  ·  " & ThisItem.HomeLocation)
                                                Wrap: =false
                                          - btnInvReqPickGo:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Reserve " & ThisItem.Title
                                                Appearance: =ButtonAppearance.Secondary
                                                DisplayMode: =If(locBusy || IsBlank(dteInvReqStart.SelectedDate) || IsBlank(dteInvReqEnd.SelectedDate), DisplayMode.Disabled, DisplayMode.Edit)
                                                Height: =36
                                                Icon: ="Add"
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =UpdateContext({locBusy: true});
                                                  IfError(
                                                      With(
                                                          {raw: ParseJSON('Inventory-Action'.Run(JSON({actionVersion: fxInvActionVersion, action: "Reserve", lineId: locReqSel.LineId, assetId: ThisItem.ID, startDate: Text(dteInvReqStart.SelectedDate, "yyyy-mm-dd"), endDate: Text(dteInvReqEnd.SelectedDate, "yyyy-mm-dd")})).response)},
                                                          UpdateContext({locResult: {Status: Text(raw.status), Message: Text(raw.message)}})
                                                      ),
                                                      UpdateContext({locResult: {Status: "Failed", Message: "The inventory service could not be reached. Try again."}})
                                                  );
                                                  UpdateContext({locBusy: false});
                                                  Notify(locResult.Message, If(locResult.Status = "Success", NotificationType.Success, NotificationType.Error));
                                                  If(locResult.Status = "Success", Set(gblInvLoadedAt, Blank()); Select(btnInvReqReload); Select(btnInvReqLoad))
                                                Text: ="Reserve"
