Screens:
  scrInvRequests:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
      LoadingSpinnerColor: =RGBA(15, 76, 129, 1)
      OnVisible: |-
        =// Opened from the Support Request Work Center ("Open in Inventory"): show that request line once (Param line = RequestEquipment ID).
        If(
            !IsBlank(Param("line")) && !Coalesce(gblInvLineParamUsed, false),
            Set(gblInvLineParamUsed, true);
            Set(gblInvReqOpenLine, Value(Param("line")))
        );
        UpdateContext({locBusy: false});
        If(IsBlank(gblInvLoadedAt) || DateDiff(gblInvLoadedAt, Now(), TimeUnit.Minutes) >= 2, Select(btnInvRqReload));
        Select(btnInvRqLoad)
    Children:
      - conInvRqRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conInvRqHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(15, 76, 129, 1)
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =56
                  LayoutMinWidth: =0
                  PaddingLeft: =8
                  PaddingRight: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnInvRqNavToggle:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        Icon: ="Navigation"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinWidth: =40
                        OnSelect: =Set(varNavCollapsed, !varNavCollapsed)
                        Text: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Tooltip: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Width: =40
                  - txtInvRqAppTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Inventory"
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinWidth: =120
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Inventory"
                        Wrap: =false
                  - txtInvRqUserName:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Signed in as " & User().FullName
                        Align: =Align.Right
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =User().FullName
                        Visible: =App.Width >= 640
                        Width: =240
                        Wrap: =false
            - conInvRqBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conInvRqNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(varNavCollapsed, 56, 240)
                      Children:
                        - galInvRqNav:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Main navigation"
                              FillPortions: =0
                              Height: =CountRows(fxInvVisibleNav) * 46
                              Items: =fxInvVisibleNav
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TabIndex: =0
                              TemplatePadding: =2
                              TemplateSize: =44
                            Children:
                              - conInvRqNavRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.Id = "requests", RGBA(230, 240, 250, 1), RGBA(0, 0, 0, 0))
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - btnInvRqNavItem:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =ThisItem.Label
                                          Align: =If(varNavCollapsed, Align.Center, Align.Left)
                                          Appearance: =ButtonAppearance.Subtle
                                          Color: =If(ThisItem.Id = "requests", RGBA(15, 76, 129, 1), RGBA(36, 36, 36, 1))
                                          FillPortions: =1
                                          FontWeight: =If(ThisItem.Id = "requests", FontWeight.Semibold, FontWeight.Normal)
                                          Height: =40
                                          Icon: =ThisItem.Icon
                                          IconStyle: =If(ThisItem.Id = "requests", IconStyle.Filled, IconStyle.Outline)
                                          Layout: =If(varNavCollapsed, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                                          LayoutMinWidth: =40
                                          OnSelect: =Navigate(ThisItem.Target, ScreenTransition.None)
                                          Text: =ThisItem.Label
                                          Tooltip: =ThisItem.Label
                  - conInvRqMain:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =If(App.Width >= 800, 32, 16)
                        PaddingRight: =If(App.Width >= 800, 32, 16)
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnInvRqReload:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Reload inventory data"
                              Height: =36
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =// Inventory data for all screens (whole lists; fine at the current volume).
                                Set(gblInvLoading, true);
                                Refresh(InventoryAssets);
                                Refresh(InventoryCheckouts);
                                Refresh(InventoryReservations);
                                Refresh(InventoryReceipts);
                                Set(gblInvAssets, AddColumns(ForAll(InventoryAssets, ThisRecord), Dept, Department.Value, Status, 'Asset Status'.Value, Kind, 'Asset Kind'.Value));
                                Set(gblInvOpenCheckouts, AddColumns(Filter(InventoryCheckouts, 'Checkout Status'.Value = "Active" || 'Checkout Status'.Value = "Awaiting Acknowledgement" || 'Checkout Status'.Value = "Return Required"), Status, 'Checkout Status'.Value));
                                Set(gblInvReserved, Filter(InventoryReservations, 'Reservation Status'.Value = "Reserved"));
                                Set(gblInvLines, Filter(RequestEquipment, 'Needs Inventory Action' = true));
                                Set(gblInvLoadedAt, Now());
                                Set(gblInvLoading, false)
                              Text: ="Reload"
                              Visible: =false
                              Width: =10
                        - btnInvRqLoad:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Load request items"
                              Height: =36
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Refresh(RequestEquipment); Refresh(Requests); Refresh(CourseSupportDetails); Refresh(InventoryReservations); Refresh(InventoryCheckouts);
                                Set(
                                    gblInvReqLines,
                                    SortByColumns(
                                        Filter(
                                            ForAll(
                                                Filter(RequestEquipment, 'Needs Inventory Action' = true && ('Line Status'.Value = "Approved" || 'Line Status'.Value = "Fulfillment Pending")) As ln,
                                                With(
                                                    {req: With({rid: ln.Request.Id}, LookUp(Requests, ID = rid))},
                                                    With(
                                                        {course: With({rnum: req.'Request Number'}, LookUp(CourseSupportDetails, 'Course Support Record' = rnum))},
                                                        {
                                                            LineId: ln.ID, Req: req, ReqId: req.ID, Course: course, Route: Upper(Coalesce(ln.'Department Route'.Value, "")),
                                                            Item: Coalesce(ln.'Equipment Name Snapshot', "Equipment"), CatalogId: ln.Equipment.Id,
                                                            Qty: Coalesce(ln.'Quantity Approved', ln.'Quantity Requested', 1),
                                                            Start: Coalesce(course.'Course Start Date', Today()), End: Coalesce(course.'Course End Date', course.'Course Start Date', Today()),
                                                            Reserved: CountRows(Filter(InventoryReservations, 'Request Equipment Id' = ln.ID && 'Reservation Status'.Value = "Reserved")),
                                                            Issued: CountRows(Filter(InventoryCheckouts, 'Request Equipment Id' = ln.ID))
                                                        }
                                                    )
                                                )
                                            ),
                                            !IsBlank(Req) && Req.'Current Stage' in ["Fulfillment", "IT Fulfillment"] &&
                                                (("AV" in Route && fxCanManage("AV")) || ("IT" in Route && fxCanManage("IT")))
                                        ),
                                        "Start",
                                        SortOrder.Ascending
                                    )
                                );
                                Set(
                                    gblInvReqReqs,
                                    SortByColumns(
                                        ForAll(
                                            Distinct(gblInvReqLines, ReqId) As g,
                                            With(
                                                {ls: Filter(gblInvReqLines, ReqId = g.Value)},
                                                {
                                                    ReqId: g.Value, Req: First(ls).Req, Course: First(ls).Course, Start: First(ls).Start, End: First(ls).End,
                                                    Items: CountRows(ls), Qty: Sum(ls, Qty), Reserved: Sum(ls, Reserved), Issued: Sum(ls, Issued),
                                                    Routes: Concat(Distinct(ls, Route), Value, ", "), ItemNames: Concat(ls, Item & If(Qty > 1, " ×" & Qty, ""), ", ")
                                                }
                                            )
                                        ),
                                        "Start",
                                        SortOrder.Ascending
                                    )
                                );
                                // Opened from a Home row: open that item's request, with the item selected, once.
                                If(
                                    !IsBlank(gblInvReqOpenLine),
                                    With({ln: LookUp(gblInvReqLines, LineId = gblInvReqOpenLine)}, UpdateContext({locReqRid: ln.ReqId, locReqSel: ln}); Clear(colReqSkip)),
                                    UpdateContext({locReqSel: If(IsBlank(locReqSel), Blank(), LookUp(gblInvReqLines, LineId = locReqSel.LineId))})
                                );
                                Set(gblInvReqOpenLine, Blank())
                              Text: ="Load"
                              Visible: =false
                              Width: =10
                        - conInvRqPageHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =64
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conInvRqTitles:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvRqPageTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Bold
                                          Height: =36
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =24
                                          Text: =If(IsBlank(LookUp(gblInvReqReqs, ReqId = locReqRid)), "Request items", LookUp(gblInvReqReqs, ReqId = locReqRid).Req.'Request Number')
                                          Wrap: =false
                                    - txtInvRqPageSubtitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =If(IsBlank(LookUp(gblInvReqReqs, ReqId = locReqRid)), "Reserve and issue equipment approved on Support Requests.", "Reserve units for each item, then issue them together.")
                                          Wrap: =false
                              - btnInvRqBack:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Back to all requests"
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =36
                                    Icon: ="ArrowLeft"
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =UpdateContext({locReqRid: Blank(), locReqSel: Blank()})
                                    Text: ="All requests"
                                    Visible: =!IsBlank(LookUp(gblInvReqReqs, ReqId = locReqRid))
                                    Width: =160
                              - txtInvRqUpdated:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Right
                                    Color: =RGBA(97, 97, 97, 1)
                                    Height: =20
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =If(gblInvLoading, "Loading…", If(IsBlank(gblInvLoadedAt), "", "Updated " & Text(gblInvLoadedAt, "h:mm AM/PM")))
                                    Visible: =App.Width >= 900
                                    Width: =120
                                    Wrap: =false
                              - btnInvRqRefresh:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Refresh"
                                    Appearance: =ButtonAppearance.Secondary
                                    DisplayMode: =If(gblInvLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnInvRqReload)
                                    Text: ="Refresh"
                                    Width: =120
                        - conInvRqIssueMsg:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =If(locIssueOk, RGBA(223, 246, 221, 1), RGBA(255, 244, 206, 1))
                              FillPortions: =0
                              Height: =64
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =16
                              PaddingRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Visible: =!IsBlank(locIssueMsg)
                            Children:
                              - txtInvRqIssueMsg:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =If(locIssueOk, RGBA(16, 92, 16, 1), RGBA(131, 82, 0, 1))
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =56
                                    LayoutMinWidth: =0
                                    Size: =13
                                    Text: |-
                                      =If(locIssueOk, "Issued.  ", "Check this:  ") & locIssueMsg
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =true
                              - btnInvRqIssueMsgClose:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Dismiss the issue result"
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =36
                                    LayoutMinWidth: =0
                                    OnSelect: =UpdateContext({locIssueMsg: ""})
                                    Text: ="Dismiss"
                                    Width: =100
                        - conInvRqList:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =20 + 48 + 12 + Max(24, CountRows(gblInvReqReqs) * 84) + 24
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =20
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Visible: =IsBlank(LookUp(gblInvReqReqs, ReqId = locReqRid)) && fxIsInvStaff
                            Children:
                              - conInvRqListHead:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvRqListTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =16
                                          Text: ="Requests to fill (" & CountRows(gblInvReqReqs) & ")"
                                    - txtInvRqListDesc:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="Approved Support Requests with equipment for your department. Soonest course first."
                                          Wrap: =false
                              - txtInvRqNone:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(97, 97, 97, 1)
                                    Height: =24
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =If(locBusy, "Loading…", "Nothing to fill. Approved inventory items appear here once a request reaches fulfillment.")
                                    Visible: =IsEmpty(gblInvReqReqs)
                                    Wrap: =false
                              - galInvRqList:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Requests to fill"
                                    FillPortions: =0
                                    Height: =Self.AllItemsCount * 84
                                    Items: =gblInvReqReqs
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    ShowScrollbar: =false
                                    TabIndex: =0
                                    TemplatePadding: =0
                                    TemplateSize: =84
                                  Children:
                                    - conInvRqRow:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(225, 228, 232, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Height: =Parent.TemplateHeight - 6
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =12
                                          PaddingLeft: =12
                                          PaddingRight: =8
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Width: =Parent.TemplateWidth
                                        Children:
                                          - conInvRqRowAccent:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =If(ThisItem.Issued >= ThisItem.Qty, RGBA(16, 110, 16, 1), ThisItem.Start <= DateAdd(Today(), 7, TimeUnit.Days), RGBA(164, 38, 44, 1), RGBA(92, 45, 145, 1))
                                                FillPortions: =0
                                                Height: =48
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Width: =4
                                          - conInvRqRowText:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =74
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutJustifyContent: =LayoutJustifyContent.Center
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - txtInvRqRowL1:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =RGBA(36, 36, 36, 1)
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =ThisItem.Req.'Request Number' & "   " & Coalesce(ThisItem.Req.'Request Subject', "(No subject)")
                                                      Wrap: =false
                                                - txtInvRqRowL2:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =RGBA(97, 97, 97, 1)
                                                      Height: =20
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingTop: =0
                                                      Size: =12
                                                      Text: |-
                                                        =ThisItem.Items & If(ThisItem.Items = 1, " item: ", " items: ") & ThisItem.ItemNames & "  ·  " & ThisItem.Routes
                                                      Wrap: =false
                                                - txtInvRqRowL3:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =RGBA(97, 97, 97, 1)
                                                      Height: =20
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingTop: =0
                                                      Size: =12
                                                      Text: =If(IsBlank(ThisItem.Course), "No course dates", "Course " & Text(ThisItem.Start, "mmm d") & " – " & Text(ThisItem.End, "mmm d, yyyy")) & "  ·  Requester " & fxPersonName(Coalesce(ThisItem.Req.'Requester Name', ThisItem.Req.'Requester Email')) & If(IsBlank(ThisItem.Course.Room), "", "  ·  " & ThisItem.Course.Room)
                                                      Wrap: =false
                                          - txtInvRqRowRes:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Align: =Align.Center
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(92, 45, 145, 1)
                                                Fill: =RGBA(243, 238, 250, 1)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =24
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =12
                                                RadiusBottomRight: =12
                                                RadiusTopLeft: =12
                                                RadiusTopRight: =12
                                                Size: =12
                                                Text: ="Reserved " & ThisItem.Reserved & " of " & ThisItem.Qty
                                                Width: =130
                                                Wrap: =false
                                          - txtInvRqRowIss:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Align: =Align.Center
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =If(ThisItem.Issued > 0, RGBA(16, 110, 16, 1), RGBA(97, 97, 97, 1))
                                                Fill: =If(ThisItem.Issued > 0, RGBA(223, 246, 221, 1), RGBA(237, 239, 242, 1))
                                                FontWeight: =FontWeight.Semibold
                                                Height: =24
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =12
                                                RadiusBottomRight: =12
                                                RadiusTopLeft: =12
                                                RadiusTopRight: =12
                                                Size: =12
                                                Text: ="Issued " & ThisItem.Issued & " of " & ThisItem.Qty
                                                Width: =120
                                                Wrap: =false
                                          - btnInvRqRowOpen:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Open " & ThisItem.Req.'Request Number'
                                                Appearance: =ButtonAppearance.Secondary
                                                Height: =36
                                                Icon: ="ChevronRight"
                                                Layout: =ButtonLayout.IconAfter
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =UpdateContext({locReqRid: ThisItem.ReqId, locReqSel: Blank()}); Clear(colReqSkip); Reset(cmbInvRqWho); Reset(dteInvRqReturn); Reset(txtInvRqPhone)
                                                Text: ="Open"
                                                Width: =110
                        - conInvRqSel:
                            Control: GroupContainer
                            Variant: AutoLayout
