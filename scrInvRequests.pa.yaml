                                          Size: =12
                                          Text: =If(locReqSel.Reserved + locReqSel.Issued < locReqSel.Qty, "You can issue now and reserve the rest later.", "Issuing all approved units completes this item on the request.")
                                    - spnInvReqBusy:
                                        Control: ModernSpinner
                                        Properties:
                                          AccessibleLabel: ="Working"
                                          LayoutMinWidth: =0
                                          Visible: =locBusy
                                    - btnInvReqIssueGo:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          DisplayMode: =If(locBusy || IsBlank(dteInvReqReturn.SelectedDate) || IsBlank(If(IsBlank(cmbInvReqWho.Selected), locReqSel.Req.RequesterEmail, cmbInvReqWho.Selected.Mail)), DisplayMode.Disabled, DisplayMode.Edit)
                                          Height: =36
                                          Icon: ="Send"
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =// One receipt for this request's reserved units: StartReceipt (Request Loan) -> Issue each reservation -> FinishReceipt.
                                            UpdateContext({locBusy: true});
                                            With(
                                                {mine: AddColumns(Filter(InventoryReservations, RequestEquipmentId = locReqSel.LineId && ReservationStatus.Value = "Reserved"), A, LookUp(gblInvAssets, ID = AssetId))},
                                                With(
                                                    {dept: First(mine).A.Dept},
                                                    IfError(
                                                        With(
                                                            {start: ParseJSON('Inventory-Action'.Run(JSON({
                                                                actionVersion: fxInvActionVersion, action: "StartReceipt",
                                                                recipient: {email: Lower(If(IsBlank(cmbInvReqWho.Selected), locReqSel.Req.RequesterEmail, cmbInvReqWho.Selected.Mail)), name: If(IsBlank(cmbInvReqWho.Selected), Coalesce(locReqSel.Req.RequesterName, locReqSel.Req.RequesterEmail), cmbInvReqWho.Selected.DisplayName), claims: "i:0#.f|membership|" & Lower(If(IsBlank(cmbInvReqWho.Selected), locReqSel.Req.RequesterEmail, cmbInvReqWho.Selected.Mail))},
                                                                dutyPhone: Trim(txtInvReqPhone.Text), orgAccountNo: Switch(dept, "IT", "TSOS", "AV", "TSAV", ""),
                                                                returnDate: Text(dteInvReqReturn.SelectedDate, "yyyy-mm-dd"), checkoutType: "Request Loan", department: dept,
                                                                requestId: locReqSel.Req.ID, signatureMethod: drpInvReqSign.Selected.Value
                                                            })).response)},
                                                            If(
                                                                Text(start.status) <> "Success",
                                                                Notify(Text(start.message), NotificationType.Error),
                                                                With(
                                                                    {rid: Value(start.id)},
                                                                    With(
                                                                        {results: ForAll(Filter(mine, A.Dept = dept) As m, With({r: ParseJSON('Inventory-Action'.Run(fxInvIssuePayload(rid, 0, m.ID)).response)}, {Ok: Text(r.status) = "Success", Message: m.AssetTagSnapshot & ": " & Text(r.message)}))},
                                                                        With(
                                                                            {finish: ParseJSON('Inventory-Action'.Run(fxInvFinishPayload(rid)).response)},
                                                                            Notify(Text(finish.message) & If(IsEmpty(Filter(results, !Ok)), "", "  Not issued: " & Concat(Filter(results, !Ok), Message, "; ")), If(IsEmpty(Filter(results, !Ok)), NotificationType.Success, NotificationType.Warning))
                                                                        )
                                                                    )
                                                                )
                                                            )
                                                        ),
                                                        Notify("The inventory service could not be reached. Check People before trying again.", NotificationType.Error)
                                                    )
                                                )
                                            );
                                            UpdateContext({locBusy: false});
                                            Set(gblInvLoadedAt, Blank()); Select(btnInvReqReload); Select(btnInvReqLoad)
                                          Text: ="Issue " & CountRows(AddColumns(Filter(InventoryReservations, RequestEquipmentId = locReqSel.LineId && ReservationStatus.Value = "Reserved"), A, LookUp(gblInvAssets, ID = AssetId))) & If(CountRows(AddColumns(Filter(InventoryReservations, RequestEquipmentId = locReqSel.LineId && ReservationStatus.Value = "Reserved"), A, LookUp(gblInvAssets, ID = AssetId))) = 1, " unit", " units")
