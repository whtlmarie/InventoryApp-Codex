                                                Items: |-
                                                  =Table({Value: "Electronic", Label: "Electronic: approval in Outlook / Teams"}, {Value: "CAC", Label: "CAC: sign the PDF in Adobe, then upload it"})
                                                LayoutMinWidth: =0
                                                Width: =Parent.Width
                              - conInvReqIssBtns:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
