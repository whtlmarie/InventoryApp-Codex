                                          Width: =160
                                    - btnInvRqIssueGo:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          DisplayMode: =If(locBusy || IsEmpty(Filter(AddColumns(Filter(InventoryReservations, 'Request Id' = locReqRid && 'Reservation Status'.Value = "Reserved"), A, LookUp(gblInvAssets, ID = 'Asset Id'), ItemName, Coalesce(LookUp(gblInvReqLines, LineId = 'Request Equipment Id').Item, "Item")), !(ID in colReqSkip.Value))) || IsBlank(dteInvRqReturn.SelectedDate) || IsBlank(If(IsBlank(cmbInvRqWho.Selected), LookUp(gblInvReqReqs, ReqId = locReqRid).Req.'Requester Email', cmbInvRqWho.Selected.Mail)), DisplayMode.Disabled, DisplayMode.Edit)
                                          Height: =36
                                          Icon: ="Send"
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =// The ticked units, on one receipt per department: StartReceipt -> Issue each -> FinishReceipt.
                                            UpdateContext({locBusy: true});
                                            With(
                                                {all: Filter(AddColumns(Filter(InventoryReservations, 'Request Id' = locReqRid && 'Reservation Status'.Value = "Reserved"), A, LookUp(gblInvAssets, ID = 'Asset Id'), ItemName, Coalesce(LookUp(gblInvReqLines, LineId = 'Request Equipment Id').Item, "Item")), !(ID in colReqSkip.Value))},
                                                With(
                                                    {
                                                        byDept: ForAll(
                                                            Distinct(all, A.Dept) As d,
                                                            With(
                                                                {dept: d.Value},
                                                                IfError(
                                                                    With(
                                                                        {start: ParseJSON(With({invPl: JSON({
                                                                            actionVersion: fxInvActionVersion, action: "StartReceipt",
                                                                            recipient: {email: Lower(If(IsBlank(cmbInvRqWho.Selected), LookUp(gblInvReqReqs, ReqId = locReqRid).Req.'Requester Email', cmbInvRqWho.Selected.Mail)), name: If(IsBlank(cmbInvRqWho.Selected), Coalesce(LookUp(gblInvReqReqs, ReqId = locReqRid).Req.'Requester Name', LookUp(gblInvReqReqs, ReqId = locReqRid).Req.'Requester Email'), cmbInvRqWho.Selected.DisplayName), claims: "i:0#.f|membership|" & Lower(If(IsBlank(cmbInvRqWho.Selected), LookUp(gblInvReqReqs, ReqId = locReqRid).Req.'Requester Email', cmbInvRqWho.Selected.Mail))},
                                                                            dutyPhone: Trim(txtInvRqPhone.Text), orgAccountNo: Switch(dept, "IT", "TSOS", "AV", "TSAV", ""),
                                                                            returnDate: Text(dteInvRqReturn.SelectedDate, "yyyy-mm-dd"), checkoutType: "Request Loan", department: dept,
                                                                            requestId: locReqRid, signatureMethod: drpInvRqSign.Selected.Value
                                                                        })}, Switch(fxInvFlowFor(Text(ParseJSON(invPl).action)), "Requests", 'Inventory-Requests'.Run(invPl), "Checkout", 'Inventory-Checkout'.Run(invPl), 'Inventory-Assets'.Run(invPl))).response)},
                                                                        If(
                                                                            Text(start.status) <> "Success",
                                                                            {Ok: false, Msg: dept & ": " & Text(start.message)},
                                                                            With(
                                                                                {rid: Value(start.id)},
                                                                                With(
                                                                                    // All of this department's ticked units in one IssueBatch call (2026-10-07).
                                                                                    {batch: ParseJSON(With({invPl: JSON({actionVersion: fxInvActionVersion, action: "IssueBatch", receiptId: rid, reservationIds: Concat(Filter(all, A.Dept = dept), Text(ID), ",")})}, Switch(fxInvFlowFor(Text(ParseJSON(invPl).action)), "Requests", 'Inventory-Requests'.Run(invPl), "Checkout", 'Inventory-Checkout'.Run(invPl), 'Inventory-Assets'.Run(invPl))).response)},
                                                                                    With(
                                                                                        {finish: ParseJSON(With({invPl: fxInvFinishPayload(rid)}, Switch(fxInvFlowFor(Text(ParseJSON(invPl).action)), "Requests", 'Inventory-Requests'.Run(invPl), "Checkout", 'Inventory-Checkout'.Run(invPl), 'Inventory-Assets'.Run(invPl))).response)},
                                                                                        {
                                                                                            Ok: Text(batch.status) = "Success" && !("Not issued" in Text(batch.message)),
                                                                                            Msg: Text(finish.message) & If(Text(batch.status) = "Success" && !("Not issued" in Text(batch.message)), "", "  " & Text(batch.message))
                                                                                        }
                                                                                    )
                                                                                )
                                                                            )
                                                                        )
                                                                    ),
                                                                    {Ok: false, Msg: dept & ": the inventory service could not be reached. Check People before trying again."}
                                                                )
                                                            )
                                                        )
                                                    },
                                                    Notify(Concat(byDept, Msg, "   "), If(IsEmpty(Filter(byDept, !Ok)), NotificationType.Success, NotificationType.Warning));
                                                    // Also kept on screen (2026-10-19 test: the toast was gone by the time the list reloaded).
                                                    UpdateContext({locIssueMsg: Concat(byDept, Msg, "   "), locIssueOk: IsEmpty(Filter(byDept, !Ok))})
                                                )
                                            );
                                            UpdateContext({locBusy: false});
                                            Clear(colReqSkip);
                                            Set(gblInvLoadedAt, Blank()); Select(btnInvRqReload); Select(btnInvRqLoad)
                                          Text: ="Issue selected (" & CountRows(Filter(AddColumns(Filter(InventoryReservations, 'Request Id' = locReqRid && 'Reservation Status'.Value = "Reserved"), A, LookUp(gblInvAssets, ID = 'Asset Id'), ItemName, Coalesce(LookUp(gblInvReqLines, LineId = 'Request Equipment Id').Item, "Item")), !(ID in colReqSkip.Value))) & ")"
                                          Width: =190
