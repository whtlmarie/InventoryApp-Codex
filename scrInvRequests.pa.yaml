                                          AccessibleLabel: =Self.Text
                                          Appearance: =ButtonAppearance.Secondary
                                          DisplayMode: =If(locBusy || IsBlank(Trim(txtInvReqNote.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                                          Height: =36
                                          Icon: ="Checkmark"
                                          LayoutMinWidth: =0
