                                          Text: |-
                                            =CountRows(With(
                                                {s: dteInvReqStart.SelectedDate, e: dteInvReqEnd.SelectedDate, q: Lower(Trim(txtInvReqFind.Text))},
                                                SortByColumns(
                                                    AddColumns(
                                                        Filter(
                                                            gblInvAssets,
                                                            Status = "Available" && IsActive && Dept in locReqSel.Route && fxCanManage(Dept) &&
                                                                (Coalesce(CatalogItemId, 0) = 0 || CatalogItemId = locReqSel.CatalogId) &&
                                                                !(ID in Filter(gblInvReserved, StartDate <= e && EndDate >= s).AssetId) &&
                                                                (IsBlank(q) || q in Lower(Title) || q in Lower(Coalesce(SerialNumber, "")) || q in Lower(Coalesce(Model, "")))
                                                        ),
                                                        Fit, If(CatalogItemId = locReqSel.CatalogId, 0, 1)
                                                    ),
                                                    "Fit", SortOrder.Ascending, "Title", SortOrder.Ascending
                                                )
                                            )) & " available for these dates"
                                          Wrap: =false
                                    - btnInvReqReserveN:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          DisplayMode: |-
                                            =If(locBusy || IsEmpty(With(
                                                {s: dteInvReqStart.SelectedDate, e: dteInvReqEnd.SelectedDate, q: Lower(Trim(txtInvReqFind.Text))},
                                                SortByColumns(
                                                    AddColumns(
                                                        Filter(
                                                            gblInvAssets,
                                                            Status = "Available" && IsActive && Dept in locReqSel.Route && fxCanManage(Dept) &&
                                                                (Coalesce(CatalogItemId, 0) = 0 || CatalogItemId = locReqSel.CatalogId) &&
                                                                !(ID in Filter(gblInvReserved, StartDate <= e && EndDate >= s).AssetId) &&
                                                                (IsBlank(q) || q in Lower(Title) || q in Lower(Coalesce(SerialNumber, "")) || q in Lower(Coalesce(Model, "")))
                                                        ),
                                                        Fit, If(CatalogItemId = locReqSel.CatalogId, 0, 1)
                                                    ),
                                                    "Fit", SortOrder.Ascending, "Title", SortOrder.Ascending
                                                )
                                            )) || IsBlank(dteInvReqStart.SelectedDate) || IsBlank(dteInvReqEnd.SelectedDate), DisplayMode.Disabled, DisplayMode.Edit)
                                          Height: =36
                                          Icon: ="Add"
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =// Reserve the first units still needed (best catalog match first), one flow call each.
                                            UpdateContext({locBusy: true});
                                            With(
                                                {picks: FirstN(With(
                                                {s: dteInvReqStart.SelectedDate, e: dteInvReqEnd.SelectedDate, q: Lower(Trim(txtInvReqFind.Text))},
                                                SortByColumns(
                                                    AddColumns(
                                                        Filter(
                                                            gblInvAssets,
                                                            Status = "Available" && IsActive && Dept in locReqSel.Route && fxCanManage(Dept) &&
                                                                (Coalesce(CatalogItemId, 0) = 0 || CatalogItemId = locReqSel.CatalogId) &&
                                                                !(ID in Filter(gblInvReserved, StartDate <= e && EndDate >= s).AssetId) &&
                                                                (IsBlank(q) || q in Lower(Title) || q in Lower(Coalesce(SerialNumber, "")) || q in Lower(Coalesce(Model, "")))
                                                        ),
                                                        Fit, If(CatalogItemId = locReqSel.CatalogId, 0, 1)
                                                    ),
                                                    "Fit", SortOrder.Ascending, "Title", SortOrder.Ascending
                                                )
                                            ), Max(0, locReqSel.Qty - locReqSel.Reserved - locReqSel.Issued))},
                                                With(
                                                    {results: ForAll(picks As a, IfError(With({r: ParseJSON('Inventory-Action'.Run(JSON({actionVersion: fxInvActionVersion, action: "Reserve", lineId: locReqSel.LineId, assetId: a.ID, startDate: Text(dteInvReqStart.SelectedDate, "yyyy-mm-dd"), endDate: Text(dteInvReqEnd.SelectedDate, "yyyy-mm-dd")})).response)}, {Ok: Text(r.status) = "Success", Message: a.Title & ": " & Text(r.message)}), {Ok: false, Message: a.Title & ": the inventory service could not be reached."}))},
                                                    Notify(CountRows(Filter(results, Ok)) & " reserved." & If(IsEmpty(Filter(results, !Ok)), "", "  Not reserved: " & Concat(Filter(results, !Ok), Message, "; ")), If(IsEmpty(Filter(results, !Ok)), NotificationType.Success, NotificationType.Warning))
                                                )
                                            );
                                            UpdateContext({locBusy: false});
                                            Set(gblInvLoadedAt, Blank()); Select(btnInvReqReload); Select(btnInvReqLoad)
                                          Text: |-
                                            ="Reserve " & Min(Max(0, locReqSel.Qty - locReqSel.Reserved - locReqSel.Issued), CountRows(With(
                                                {s: dteInvReqStart.SelectedDate, e: dteInvReqEnd.SelectedDate, q: Lower(Trim(txtInvReqFind.Text))},
                                                SortByColumns(
                                                    AddColumns(
                                                        Filter(
                                                            gblInvAssets,
                                                            Status = "Available" && IsActive && Dept in locReqSel.Route && fxCanManage(Dept) &&
                                                                (Coalesce(CatalogItemId, 0) = 0 || CatalogItemId = locReqSel.CatalogId) &&
                                                                !(ID in Filter(gblInvReserved, StartDate <= e && EndDate >= s).AssetId) &&
                                                                (IsBlank(q) || q in Lower(Title) || q in Lower(Coalesce(SerialNumber, "")) || q in Lower(Coalesce(Model, "")))
                                                        ),
                                                        Fit, If(CatalogItemId = locReqSel.CatalogId, 0, 1)
                                                    ),
                                                    "Fit", SortOrder.Ascending, "Title", SortOrder.Ascending
                                                )
                                            ))) & " for me"
