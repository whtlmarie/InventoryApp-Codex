App:
  Properties:
    Formulas: |-
      =// ---------- Current user and roles (same UserRoles list as the Support Request app) ----------
      fxCurrentUserEmail = Lower(Trim(User().Email));
      fxCurrentUserName = User().FullName;
      fxMyRoles = Distinct(ForAll(Filter(UserRoles, 'User Email' = fxCurrentUserEmail && 'Is Active' = true), {R: Trim(ThisRecord.Role.Value)}), R);
      fxHasRole(roleName: Text): Boolean = roleName in fxMyRoles.Value;
      fxIsDeveloper = fxHasRole("Developer");
      fxIsAdministrator = fxHasRole("Administrator");
      // Inventory access (decision 2026-10-02): AV Technician -> AV, IT Technician -> IT, Inventory Manager and Developer -> both.
      // Administrator can view everything but change nothing. The Inventory - Action flow enforces the same rules.
      fxIsInvManager = fxIsDeveloper || fxHasRole("Inventory Manager");
      fxInvDeptRoles = Table({Dept: "AV", Role: "AV Technician"}, {Dept: "IT", Role: "IT Technician"});
      fxMyDepts = Filter(fxInvDeptRoles, fxIsInvManager || fxHasRole(Role));
      fxCanManage(dept: Text): Boolean = dept in fxMyDepts.Dept;
      fxIsInvStaff = !IsEmpty(fxMyDepts);
      fxCanViewInventory = fxIsInvStaff || fxIsAdministrator;
      fxDefaultDept = If(CountRows(fxMyDepts) = 1, First(fxMyDepts).Dept, "All");
      fxDeptFilters = Table({Key: "All", Label: "All"}, {Key: "AV", Label: "AV"}, {Key: "IT", Label: "IT"});

      // ---------- Inventory constants (match the Inventory - Action flow Config) ----------
      fxInvActionVersion = "InventoryAction-v1";
      // Which Inventory flow handles an action (the single Inventory - Action flow was split on 2026-10-06).
      fxInvFlowFor(action: Text): Text = If(
          action in ["Reserve", "ReserveBatch", "ReleaseReservation", "CloseLine"], "Requests",
          action in ["StartReceipt", "Issue", "IssueBatch", "FinishReceipt", "Acknowledge", "Return", "ReturnBatch", "Extend", "ResendApproval", "CacUpload", "SwitchMethod", "VoidReceipt"], "Checkout",
          "Assets"
      );
      // The acknowledgement wording and Conditions of Issue come from the "Inventory - My Receipts" flow (lib/custody-terms.js,
      // 2026-10-19); the receipt screen shows exactly what the recipient signs.
      // Icons on the receipt screen (24 px SVG; %c% = colour).
      // USAFSOS patch for the receipt screen header (assets/usafsos-patch-96.png, 96 px PNG, transparent background).
      fxUsafsosPatch = "data:image/png;base64,";
      fxRcIcon(kind: Text, color: Text): Text = "data:image/svg+xml;utf8," & EncodeUrl(
          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>" & Substitute(Switch(kind,
              "doc", "<path d='M6 2h8l4 4v16H6z' fill='none' stroke='%c%' stroke-width='1.6' stroke-linejoin='round'/><path d='M14 2v4h4M9 11h6M9 14h6M9 17h4' fill='none' stroke='%c%' stroke-width='1.6'/>",
              "check", "<circle cx='12' cy='12' r='11' fill='%c%'/><path d='M7 12.5l3.2 3.2L17 9' fill='none' stroke='#fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/>",
              "pending", "<circle cx='12' cy='12' r='9' fill='none' stroke='#D6DCE4' stroke-width='2.5'/><path d='M12 3a9 9 0 0 1 9 9' fill='none' stroke='%c%' stroke-width='2.5' stroke-linecap='round'/>",
              "todo", "<circle cx='12' cy='12' r='9' fill='none' stroke='#B8C0CC' stroke-width='1.8'/>",
              "lock", "<rect x='5' y='10' width='14' height='11' rx='2' fill='%c%'/><path d='M8 10V7a4 4 0 0 1 8 0v3' fill='none' stroke='%c%' stroke-width='2'/><circle cx='12' cy='15.5' r='1.6' fill='#fff'/>",
              "warning", "<path d='M12 3L2 21h20z' fill='none' stroke='%c%' stroke-width='1.8' stroke-linejoin='round'/><path d='M12 10v5' stroke='%c%' stroke-width='2' stroke-linecap='round'/><circle cx='12' cy='18' r='1.1' fill='%c%'/>",
              "ban", "<circle cx='12' cy='12' r='9' fill='none' stroke='%c%' stroke-width='2'/><path d='M5.6 5.6l12.8 12.8' stroke='%c%' stroke-width='2'/>",
              "info", "<circle cx='12' cy='12' r='10' fill='%c%'/><path d='M12 11v6' stroke='#fff' stroke-width='2' stroke-linecap='round'/><circle cx='12' cy='7.5' r='1.2' fill='#fff'/>",
              "person", "<circle cx='12' cy='8' r='4' fill='none' stroke='%c%' stroke-width='1.6'/><path d='M4 21c0-4 3.6-7 8-7s8 3 8 7' fill='none' stroke='%c%' stroke-width='1.6'/>",
              "calendar", "<rect x='3' y='5' width='18' height='16' rx='2' fill='none' stroke='%c%' stroke-width='1.6'/><path d='M3 10h18M8 3v4M16 3v4M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2' stroke='%c%' stroke-width='1.6'/>",
              "circlecheck", "<circle cx='12' cy='12' r='9' fill='none' stroke='%c%' stroke-width='1.6'/><path d='M8 12.5l2.6 2.6L16 9.6' fill='none' stroke='%c%' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/>",
              ""
          ), "%c%", color) & "</svg>"
      );
      fxAssetStatuses = ["Available", "Issued", "In Repair", "Pending Disposal", "Lost", "Retired", "Disposed"];
      fxSettableStatuses = ["Available", "In Repair", "Pending Disposal", "Lost", "Retired"];
      // Pick list for home locations and counts (InventoryLocations; managed on the Locations screen).
      fxInvLocations = Sort(Filter(InventoryLocations, 'Is Active' = true), Location);
      fxDispositionMethods = ["Recycled", "Destroyed", "Turned in (DLA Disposition)", "Transferred to another unit"];
      fxSanitizationMethods = ["Not applicable", "Wiped", "Degaussed", "Shredded / destroyed", "Drive removed"];
      // "Installed in Room": equipment that stays in its room (e.g. the NIPR laptop in a classified room); never reserved or issued.
      fxAssetKinds = ["Tracked Asset", "Loaner Pool", "Installed in Room"];
      fxConditions = ["Good", "Fair", "Damaged"];
      fxStatusColor(status: Text): Color = Switch(status, "Available", RGBA(16, 110, 16, 1), "Issued", RGBA(15, 76, 129, 1), "In Repair", RGBA(131, 82, 0, 1), "Pending Disposal", RGBA(92, 45, 145, 1), "Lost", RGBA(164, 38, 44, 1), RGBA(97, 97, 97, 1));
      fxStatusFill(status: Text): Color = Switch(status, "Available", RGBA(223, 246, 221, 1), "Issued", RGBA(230, 240, 250, 1), "In Repair", RGBA(255, 244, 206, 1), "Pending Disposal", RGBA(243, 238, 250, 1), "Lost", RGBA(253, 231, 233, 1), RGBA(237, 239, 242, 1));
      // Catalog items the Inventory app tracks (same rule as the Support Request inventory handoff).
      fxInvCatalog = Sort(Filter(EquipmentCatalog, 'Is Active' = true && 'Inventory Type'.Value in ["Tracked Asset", "Loaner Pool"]), 'Equipment Name');

      // ---------- Export and labels (2026-10-03) ----------
      // One CSV cell (quoted, quotes doubled) and HTML-safe text.
      fxCsv(x: Text): Text = Char(34) & Substitute(x, Char(34), Char(34) & Char(34)) & Char(34);
      fxHtml(x: Text): Text = Substitute(Substitute(Substitute(x, "&", "&amp;"), "<", "&lt;"), ">", "&gt;");
      fxOrgAccount(dept: Text): Text = Switch(dept, "IT", "TSOS", "AV", "TSAV", "");
      // Code 128 (code set B) as an SVG: start B, the text, checksum, stop; 10-module quiet zones. Patterns: app-generators/code128.js.
      fxCode128 = ["212222", "222122", "222221", "121223", "121322", "131222", "122213", "122312", "132212", "221213", "221312", "231212", "112232", "122132", "122231", "113222", "123122", "123221", "223211", "221132", "221231", "213212", "223112", "312131", "311222", "321122", "321221", "312212", "322112", "322211", "212123", "212321", "232121", "111323", "131123", "131321", "112313", "132113", "132311", "211313", "231113", "231311", "112133", "112331", "132131", "113123", "113321", "133121", "313121", "211331", "231131", "213113", "213311", "213131", "311123", "311321", "331121", "312113", "312311", "332111", "314111", "221411", "431111", "111224", "111422", "121124", "121421", "141122", "141221", "112214", "112412", "122114", "122411", "142112", "142211", "241211", "221114", "413111", "241112", "134111", "111242", "121142", "121241", "114212", "124112", "124211", "411212", "421112", "421211", "212141", "214121", "412121", "111143", "111341", "131141", "114113", "114311", "411113", "411311", "113141", "114131", "311141", "411131", "211412", "211214", "211232", "2331112"];
      fxCode128Chars = " !""#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~";
      fxCode128Svg(t: Text): Text = With(
          {s: Concat(ForAll(Sequence(Len(t)), Mid(t, Value, 1)), If(IsBlank(Find(Value, fxCode128Chars)), "?", Value))},
          With(
              {vals: ForAll(Sequence(Len(s)), Find(Mid(s, Value, 1), fxCode128Chars) - 1)},
              With(
                  {chk: Mod(104 + Sum(ForAll(Sequence(CountRows(vals)), Value * Index(vals, Value).Value), Value), 103)},
                  With(
                      {w: Index(fxCode128, 105).Value & Concat(vals, Index(fxCode128, Value + 1).Value) & Index(fxCode128, chk + 1).Value & Index(fxCode128, 107).Value},
                      With(
                          {d: ForAll(Sequence(Len(w)), {i: Value, n: Value(Mid(w, Value, 1))})},
                          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 " & (Sum(d, n) + 20) & " 40' preserveAspectRatio='none'>" &
                          Concat(Filter(d, Mod(i, 2) = 1) As b, "<rect x='" & (10 + Sum(Filter(d, i < b.i), n)) & "' y='0' width='" & b.n & "' height='40'/>") &
                          "</svg>"
                      )
                  )
              )
          )
      );
      fxCode128Image(t: Text): Text = "data:image/svg+xml;utf8," & EncodeUrl(fxCode128Svg(t));

      // How a person's name shows on screen: "LAST, FIRST M JR RANK USAF ORG" becomes "RANK First Last Jr".
      // Finds the service (USAF, USSF, ...); the word before it is the rank (or two words such as "Lt Col").
      // Middle initials and the organization are dropped. Any name that does not fit the pattern is shown in full.
      // Stored values and searches keep the full display name. Test it on Developer Tools > Name format test.
      fxPersonName(name: Text): Text = With(
          {
              n: Trim(name),
              services: ["USAF", "USSF", "USA", "USN", "USMC", "USCG"],
              twoWordRanks: ["2d Lt", "2nd Lt", "1st Lt", "Lt Col", "Brig Gen", "Maj Gen", "Lt Gen"],
              suffixes: ["JR", "SR", "II", "III", "IV"]
          },
          With(
              {c: Find(", ", n)},
              If(
                  IsBlank(c) || c < 2,
                  n,
                  With(
                      {last: Left(n, c - 1), t: Split(Mid(n, c + 2), " ")},
                      With(
                          {s: First(Filter(ForAll(Sequence(CountRows(t)), {i: Value, w: Index(t, Value).Value}), w in services)).i},
                          If(
                              IsBlank(s) || s < 3,
                              n,
                              With(
                                  {twoWord: s >= 4 && (Index(t, s - 2).Value & " " & Index(t, s - 1).Value) in twoWordRanks},
                                  With(
                                      {
                                          rank: If(twoWord, Index(t, s - 2).Value & " " & Index(t, s - 1).Value, Index(t, s - 1).Value),
                                          parts: FirstN(t, s - If(twoWord, 3, 2))
                                      },
                                      With(
                                          {suffix: If(CountRows(parts) >= 2 && Last(parts).Value in suffixes, Last(parts).Value, "")},
                                          With(
                                              {given: If(suffix = "", parts, FirstN(parts, CountRows(parts) - 1))},
                                              With(
                                                  {given2: If(CountRows(given) >= 2 && Len(Last(given).Value) = 1, FirstN(given, CountRows(given) - 1), given)},
                                                  Trim(
                                                      rank & " " & Proper(Concat(given2, Value, " ")) & " " & Proper(last) &
                                                      If(suffix = "", "", " " & If(Upper(suffix) in ["JR", "SR"], Proper(suffix), Upper(suffix)))
                                                  )
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                      )
                  )
              )
          )
      );
      // Short relative time, for example "5 min ago", "3 h ago", "2 d ago".
      fxTimeAgo(when: DateTime): Text = With(
          {m: DateDiff(when, Now(), TimeUnit.Minutes)},
          If(m < 1, "just now", m < 60, m & " min ago", m < 1440, RoundDown(m / 60, 0) & " h ago", RoundDown(m / 1440, 0) & " d ago")
      );

      // ---------- Navigation ----------
      fxInvNav = Table(
          {Id: "home", Label: "Home", Icon: "Home", Target: scrInvHome, IsAllowed: true},
          {Id: "assets", Label: "Assets", Icon: "Laptop", Target: scrInvAssets, IsAllowed: fxCanViewInventory},
          {Id: "requests", Label: "Request items", Icon: "Calendar", Target: scrInvRequests, IsAllowed: fxIsInvStaff},
          {Id: "checkout", Label: "Checkout", Icon: "Send", Target: scrInvCheckout, IsAllowed: fxIsInvStaff},
          {Id: "returns", Label: "Returns", Icon: "ArrowUndo", Target: scrInvReturns, IsAllowed: fxIsInvStaff},
          {Id: "person", Label: "People", Icon: "Person", Target: scrInvPerson, IsAllowed: fxCanViewInventory},
          {Id: "count", Label: "Inventory count", Icon: "Note", Target: scrInvCount, IsAllowed: fxCanViewInventory},
          {Id: "locations", Label: "Locations", Icon: "Location", Target: scrInvLocations, IsAllowed: fxCanViewInventory},
          {Id: "import", Label: "Import", Icon: "Add", Target: scrInvImport, IsAllowed: fxIsInvStaff}
      );
      fxInvVisibleNav = Filter(fxInvNav, IsAllowed);

      // ---------- InventoryAction-v1 payloads ----------
      fxInvAssetPayload(action: Text, assetId: Number, tag: Text, serial: Text, make: Text, model: Text, catalogItemId: Number, department: Text, kind: Text, condition: Text, homeLocation: Text, purchaseDate: Text, warrantyEnd: Text, notes: Text): Text = JSON(
          {
              actionVersion: fxInvActionVersion, action: action, assetId: assetId,
              asset: {tag: tag, serial: serial, make: make, model: model, catalogItemId: catalogItemId, department: department, kind: kind, condition: condition, homeLocation: homeLocation, purchaseDate: purchaseDate, warrantyEnd: warrantyEnd, notes: notes}
          }
      );
      fxInvStatusPayload(assetId: Number, status: Text, note: Text): Text = JSON({actionVersion: fxInvActionVersion, action: "AssetStatus", assetId: assetId, status: status, note: note});
      // One handover = one receipt: StartReceipt, then Issue per item, then FinishReceipt.
      fxInvStartReceiptPayload(email: Text, name: Text, claims: Text, dutyPhone: Text, orgAccountNo: Text, returnDate: Text, checkoutType: Text, department: Text, signatureMethod: Text): Text = JSON(
          {
              actionVersion: fxInvActionVersion, action: "StartReceipt",
              recipient: {email: email, name: name, claims: claims}, dutyPhone: dutyPhone, orgAccountNo: orgAccountNo,
              returnDate: returnDate, checkoutType: checkoutType, department: department, requestId: 0, signatureMethod: signatureMethod
          }
      );
      fxInvIssuePayload(receiptId: Number, assetId: Number, reservationId: Number): Text = JSON({actionVersion: fxInvActionVersion, action: "Issue", receiptId: receiptId, assetId: assetId, reservationId: reservationId});
      fxInvFinishPayload(receiptId: Number): Text = JSON({actionVersion: fxInvActionVersion, action: "FinishReceipt", receiptId: receiptId});
      // Person screen: check in, change return date, resend approval / record CAC signature.
      fxInvReturnPayload(checkoutId: Number, condition: Text, note: Text): Text = JSON({actionVersion: fxInvActionVersion, action: "Return", checkoutId: checkoutId, condition: condition, note: note});
      fxInvExtendPayload(checkoutId: Number, dueDate: Text, note: Text): Text = JSON({actionVersion: fxInvActionVersion, action: "Extend", checkoutId: checkoutId, dueDate: dueDate, note: note});
      fxInvReceiptPayload(action: Text, receiptId: Number): Text = JSON({actionVersion: fxInvActionVersion, action: action, receiptId: receiptId});
      // Signature method: Electronic (approval) or CAC (signed in Adobe, then uploaded).
      fxInvSwitchPayload(receiptId: Number, method: Text): Text = JSON({actionVersion: fxInvActionVersion, action: "SwitchMethod", receiptId: receiptId, method: method});
      fxInvCacUploadPayload(receiptId: Number, fileName: Text, fileContent: Text): Text = JSON({actionVersion: fxInvActionVersion, action: "CacUpload", receiptId: receiptId, file: {name: fileName, content: fileContent}});
    StartScreen: =If(!IsBlank(Param("receipt")), scrInvReceipt, !IsBlank(Param("person")), scrInvPerson, !IsBlank(Param("line")), scrInvRequests, scrInvHome)
    Theme: =PowerAppsTheme
