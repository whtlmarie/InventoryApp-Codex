                                                        found: CountRows(Filter(Filter(gblInvAssets, Dept = locCnt.Dept && IsActive && !(Status in ["Retired", "Lost"]) && (locCnt.Scope = "Department" || HomeLocation = locCnt.Value)), ID in colInvCntScanned.ID)), missing: CountRows(Filter(Filter(gblInvAssets, Dept = locCnt.Dept && IsActive && !(Status in ["Retired", "Lost"]) && (locCnt.Scope = "Department" || HomeLocation = locCnt.Value)), !(ID in colInvCntScanned.ID) && Status <> "Issued")), unexpected: CountRows(Filter(colInvCntScanned, !(ID in Filter(gblInvAssets, Dept = locCnt.Dept && IsActive && !(Status in ["Retired", "Lost"]) && (locCnt.Scope = "Department" || HomeLocation = locCnt.Value)).ID))),
                                                        summary: "Missing: " & Concat(Filter(Filter(gblInvAssets, Dept = locCnt.Dept && IsActive && !(Status in ["Retired", "Lost"]) && (locCnt.Scope = "Department" || HomeLocation = locCnt.Value)), !(ID in colInvCntScanned.ID) && Status <> "Issued"), Title, ", ") & " | Unexpected: " & Concat(Filter(colInvCntScanned, !(ID in Filter(gblInvAssets, Dept = locCnt.Dept && IsActive && !(Status in ["Retired", "Lost"]) && (locCnt.Scope = "Department" || HomeLocation = locCnt.Value)).ID)), Title & " (listed " & Coalesce(HomeLocation, Dept) & ")", ", ") & " | Out with people: " & Concat(Filter(Filter(gblInvAssets, Dept = locCnt.Dept && IsActive && !(Status in ["Retired", "Lost"]) && (locCnt.Scope = "Department" || HomeLocation = locCnt.Value)), !(ID in colInvCntScanned.ID) && Status = "Issued"), Title & " (" & CurrentHolderName & ")", ", ")
                                                    })).response)},
                                                    UpdateContext({locResult: {Status: Text(raw.status), Message: Text(raw.message)}});
                                                    If(Text(raw.status) = "Success", UpdateContext({locCnt: Patch(locCnt, {Id: Value(raw.id)})}))
                                                ),
                                                UpdateContext({locResult: {Status: "Failed", Message: "The inventory service could not be reached. Try again."}})
                                            );
                                            UpdateContext({locBusy: false});
                                            Notify(locResult.Message, If(locResult.Status = "Success", NotificationType.Success, NotificationType.Error));
                                            If(locResult.Status = "Success", UpdateContext({locCnt: Blank()}); Clear(colInvCntScanned))
                                          Text: ="Complete count"
                                          Width: =170
