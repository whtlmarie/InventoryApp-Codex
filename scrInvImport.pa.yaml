Screens:
  scrInvImport:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
      LoadingSpinnerColor: =RGBA(15, 76, 129, 1)
      OnVisible: |-
        =UpdateContext({locBusy: false});
        If(IsBlank(gblInvLoadedAt) || DateDiff(gblInvLoadedAt, Now(), TimeUnit.Minutes) >= 2, Select(btnInvImpReload))
    Children:
      - conInvImpRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conInvImpHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(15, 76, 129, 1)
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =56
                  LayoutMinWidth: =0
                  PaddingLeft: =8
                  PaddingRight: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnInvImpNavToggle:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        Icon: ="Navigation"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinWidth: =40
                        OnSelect: =Set(varNavCollapsed, !varNavCollapsed)
                        Text: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Tooltip: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Width: =40
                  - txtInvImpAppTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Inventory"
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinWidth: =120
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Inventory"
                        Wrap: =false
                  - txtInvImpUserName:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Signed in as " & User().FullName
                        Align: =Align.Right
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =User().FullName
                        Visible: =App.Width >= 640
                        Width: =240
                        Wrap: =false
            - conInvImpBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conInvImpNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(varNavCollapsed, 56, 240)
                      Children:
                        - galInvImpNav:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Main navigation"
                              FillPortions: =0
                              Height: =CountRows(fxInvVisibleNav) * 46
                              Items: =fxInvVisibleNav
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TabIndex: =0
                              TemplatePadding: =2
                              TemplateSize: =44
                            Children:
                              - conInvImpNavRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.Id = "import", RGBA(230, 240, 250, 1), RGBA(0, 0, 0, 0))
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - btnInvImpNavItem:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =ThisItem.Label
                                          Align: =If(varNavCollapsed, Align.Center, Align.Left)
                                          Appearance: =ButtonAppearance.Subtle
                                          Color: =If(ThisItem.Id = "import", RGBA(15, 76, 129, 1), RGBA(36, 36, 36, 1))
                                          FillPortions: =1
                                          FontWeight: =If(ThisItem.Id = "import", FontWeight.Semibold, FontWeight.Normal)
                                          Height: =40
                                          Icon: =ThisItem.Icon
                                          IconStyle: =If(ThisItem.Id = "import", IconStyle.Filled, IconStyle.Outline)
                                          Layout: =If(varNavCollapsed, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                                          LayoutMinWidth: =40
                                          OnSelect: =Navigate(ThisItem.Target, ScreenTransition.None)
                                          Text: =ThisItem.Label
                                          Tooltip: =ThisItem.Label
                  - conInvImpMain:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =If(App.Width >= 800, 32, 16)
                        PaddingRight: =If(App.Width >= 800, 32, 16)
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnInvImpReload:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Reload inventory data"
                              Height: =36
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =// Inventory data for all screens (whole lists; fine at the current volume).
                                Set(gblInvLoading, true);
                                Refresh(InventoryAssets);
                                Refresh(InventoryCheckouts);
                                Refresh(InventoryReservations);
                                Refresh(InventoryReceipts);
                                Set(gblInvAssets, AddColumns(ForAll(InventoryAssets, ThisRecord), Dept, Department.Value, Status, AssetStatus.Value, Kind, AssetKind.Value));
                                Set(gblInvOpenCheckouts, AddColumns(Filter(InventoryCheckouts, CheckoutStatus.Value = "Active" || CheckoutStatus.Value = "Awaiting Acknowledgement" || CheckoutStatus.Value = "Return Required"), Status, CheckoutStatus.Value));
                                Set(gblInvReserved, Filter(InventoryReservations, ReservationStatus.Value = "Reserved"));
                                Set(gblInvLines, Filter(RequestEquipment, NeedsInventoryAction = true));
                                Set(gblInvLoadedAt, Now());
                                Set(gblInvLoading, false)
                              Text: ="Reload"
                              Visible: =false
                              Width: =10
                        - conInvImpPageHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =64
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conInvImpTitles:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvImpPageTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Bold
                                          Height: =36
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =24
                                          Text: ="Import assets"
                                          Wrap: =false
                                    - txtInvImpPageSubtitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="Add many assets at once from the HQ list or our template. Nothing is created until you click Import."
                                          Wrap: =false
                              - txtInvImpUpdated:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Right
                                    Color: =RGBA(97, 97, 97, 1)
                                    Height: =20
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =If(gblInvLoading, "Loading…", If(IsBlank(gblInvLoadedAt), "", "Updated " & Text(gblInvLoadedAt, "h:mm AM/PM")))
                                    Visible: =App.Width >= 900
                                    Width: =120
                                    Wrap: =false
                              - btnInvImpRefresh:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Refresh"
                                    Appearance: =ButtonAppearance.Secondary
                                    DisplayMode: =If(gblInvLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnInvImpReload)
                                    Text: ="Refresh"
                                    Width: =120
                        - conInvImpPaste:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =20 + 48 + 12 + If(App.Width >= 1100, 60, 3 * 60 + 2 * 12) + 12 + 40 + 12 + 180 + 12 + 40 + 24
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =20
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - conInvImpPasteHead:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvImpPasteTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =16
                                          Text: ="Paste the list"
                                    - txtInvImpPasteDesc:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="In Excel select the rows with their header row, copy (Ctrl+C), then paste below (Ctrl+V)."
                                          Wrap: =false
                              - conInvImpOpts:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =If(App.Width >= 1100, 60, 3 * 60 + 2 * 12)
                                    LayoutAlignItems: =If(App.Width >= 1100, LayoutAlignItems.Start, LayoutAlignItems.Stretch)
                                    LayoutDirection: =If(App.Width >= 1100, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - conInvImpFSource:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =60
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =180
                                        Children:
                                          - txtInvImpFSourceLbl:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Color: =RGBA(66, 66, 66, 1)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: ="What you are pasting"
                                          - drpInvImpSource:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="What you are pasting"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Default: |-
                                                  ={Value: "HQ list"}
                                                Height: =36
                                                ItemDisplayText: =ThisItem.Value
                                                Items: =["HQ list", "Our template"]
                                                LayoutMinWidth: =0
                                                OnChange: |-
                                                  =Clear(colInvImp); UpdateContext({locImpDone: false})
                                                Width: =Parent.Width
                                    - conInvImpFKind:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =60
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =180
                                        Children:
                                          - txtInvImpFKindLbl:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Color: =RGBA(66, 66, 66, 1)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: ="Kind when not given"
                                          - drpInvImpKind:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="Default kind"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Default: |-
                                                  ={Value: "Tracked Asset"}
                                                Height: =36
                                                ItemDisplayText: =ThisItem.Value
                                                Items: =["Tracked Asset", "Loaner Pool"]
                                                LayoutMinWidth: =0
                                                Width: =Parent.Width
                                    - conInvImpFLoc:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =60
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =180
                                        Children:
                                          - txtInvImpFLocLbl:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Color: =RGBA(66, 66, 66, 1)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: ="Location when not matched"
                                          - drpInvImpLoc:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="Default location"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Default: |-
                                                  ={Value: "(none)"}
                                                Height: =36
                                                ItemDisplayText: =ThisItem.Value
                                                Items: |-
                                                  =Table({Value: "(none)"}, ForAll(fxInvLocations, {Value: Title}))
                                                LayoutMinWidth: =0
                                                Width: =Parent.Width
                              - conInvImpHelp:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvImpHelp:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          FillPortions: =1
                                          Height: =40
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: |-
                                            =If(drpInvImpSource.Selected.Value = "HQ list", "Needs Serial Nbr and Custodian Nbr (TSOS = IT, TSAV = AV). Also used: Mfr Name, Mfr Model Nbr, Item Desc, Name/Location (matched to each location's HQ name). Serial = asset tag.", "Needs Asset Tag and Department. Optional: Serial Number, Make, Model, Kind, Home Location, Purchase Date, Warranty End, Notes. Copy the header row into Excel to start.")
                                    - btnInvImpCopyHead:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Copy the template header row"
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =36
                                          Icon: ="Copy"
                                          LayoutMinWidth: =0
                                          OnSelect: =Copy(Concat(["Asset Tag", "Serial Number", "Make", "Model", "Department", "Kind", "Home Location", "Purchase Date", "Warranty End", "Notes"], Value, Char(9))); Notify("Header row copied. Paste it into cell A1 in Excel.", NotificationType.Success)
                                          Text: ="Copy header row"
                                          Visible: =drpInvImpSource.Selected.Value = "Our template"
                                          Width: =180
                              - txtInvImpPaste:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: ="Pasted rows"
                                    Appearance: =Appearance.Outline
                                    Height: =180
                                    LayoutMinWidth: =0
                                    Placeholder: ="Paste here"
                                    Type: =TextInputType.Multiline
                                    Width: =Parent.Width
                              - conInvImpBtns:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutJustifyContent: =LayoutJustifyContent.End
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - btnInvImpClear:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Clear"
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =36
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Reset(txtInvImpPaste); Clear(colInvImp); UpdateContext({locImpDone: false})
                                          Text: ="Clear"
                                          Width: =110
                                    - btnInvImpPreview:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Preview the import"
                                          DisplayMode: =If(locBusy || IsBlank(Trim(txtInvImpPaste.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                                          Height: =36
                                          Icon: ="Eye"
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =// Parse the pasted rows (tab-separated, header row first), then work out which rows can be imported.
                                            With(
                                                {lines: Filter(Split(Substitute(txtInvImpPaste.Text, Char(13), ""), Char(10)), !IsBlank(Trim(Value))), hq: drpInvImpSource.Selected.Value = "HQ list"},
                                                With(
                                                    {head: Split(First(lines).Value, Char(9))},
                                                    With(
                                                        {hdr: ForAll(Sequence(CountRows(head)), {i: Value, n: Lower(Trim(Index(head, Value).Value))})},
                                                        With(
                                                            {
                                                                iS: LookUp(hdr, n = If(hq, "serial nbr", "serial number")).i, iC: LookUp(hdr, n = "custodian nbr").i,
                                                                iT: LookUp(hdr, n = "asset tag").i, iD: LookUp(hdr, n = If(hq, "item desc", "department")).i,
                                                                iM: LookUp(hdr, n = If(hq, "mfr name", "make")).i, iMo: LookUp(hdr, n = If(hq, "mfr model nbr", "model")).i,
                                                                iL: LookUp(hdr, n = If(hq, "name/location", "home location")).i, iK: LookUp(hdr, n = "kind").i,
                                                                iP: LookUp(hdr, n = "purchase date").i, iW: LookUp(hdr, n = "warranty end").i, iN: LookUp(hdr, n = "notes").i
                                                            },
                                                            If(
                                                                CountRows(lines) < 2 || (hq && (IsBlank(iS) || IsBlank(iC))) || (!hq && (IsBlank(iT) || IsBlank(iD))),
                                                                Notify(If(hq, "Paste the HQ list including its header row. It needs the Serial Nbr and Custodian Nbr columns.", "Paste the template including its header row. It needs the Asset Tag and Department columns."), NotificationType.Error),
                                                                With(
                                                                    {
                                                                        raw: Filter(If(hq, ForAll(
                                                                Sequence(CountRows(lines) - 1) As s,
                                                                With(
                                                                    {c: Split(Index(lines, s.Value + 1).Value, Char(9))},
                                                                    With(
                                                                        {serial: If(IsBlank(iS), "", IfError(Trim(Index(c, iS).Value), "")), cust: Upper(If(IsBlank(iC), "", IfError(Trim(Index(c, iC).Value), ""))), desc: If(IsBlank(iD), "", IfError(Trim(Index(c, iD).Value), "")), hqLoc: If(IsBlank(iL), "", IfError(Trim(Index(c, iL).Value), ""))},
                                                                        {
                                                                            Row: s.Value, Tag: serial, Serial: serial, Make: If(IsBlank(iM), "", IfError(Trim(Index(c, iM).Value), "")), Model: If(IsBlank(iMo), "", IfError(Trim(Index(c, iMo).Value), "")),
                                                                            Dept: Switch(cust, "TSOS", "IT", "TSAV", "AV", cust), Kind: drpInvImpKind.Selected.Value,
                                                                            Loc: With({lx: Lower(hqLoc)}, If(IsBlank(lx), If(drpInvImpLoc.Selected.Value = "(none)", "", drpInvImpLoc.Selected.Value), Coalesce(LookUp(fxInvLocations, Lower(HqName) = lx || Lower(Title) = lx).Title, If(drpInvImpLoc.Selected.Value = "(none)", "", drpInvImpLoc.Selected.Value)))),
                                                                            HqLoc: hqLoc, Purchase: "", Warranty: "", Notes: If(IsBlank(desc), "", "HQ: " & desc), Source: "the HQ list"
                                                                        }
                                                                    )
                                                                )
                                                            ), ForAll(
                                                                Sequence(CountRows(lines) - 1) As s,
                                                                With(
                                                                    {c: Split(Index(lines, s.Value + 1).Value, Char(9))},
                                                                    With(
                                                                        {kind: If(IsBlank(iK), "", IfError(Trim(Index(c, iK).Value), ""))},
                                                                        {
                                                                            Row: s.Value, Tag: If(IsBlank(iT), "", IfError(Trim(Index(c, iT).Value), "")), Serial: If(IsBlank(iS), "", IfError(Trim(Index(c, iS).Value), "")), Make: If(IsBlank(iM), "", IfError(Trim(Index(c, iM).Value), "")), Model: If(IsBlank(iMo), "", IfError(Trim(Index(c, iMo).Value), "")),
                                                                            Dept: Upper(If(IsBlank(iD), "", IfError(Trim(Index(c, iD).Value), ""))), Kind: Coalesce(LookUp(["Tracked Asset", "Loaner Pool", "Installed in Room"], Lower(Value) = Lower(kind)).Value, If(IsBlank(kind), drpInvImpKind.Selected.Value, kind)),
                                                                            Loc: With({lx: Lower(Trim(If(IsBlank(iL), "", IfError(Trim(Index(c, iL).Value), ""))))}, If(IsBlank(lx), If(drpInvImpLoc.Selected.Value = "(none)", "", drpInvImpLoc.Selected.Value), Coalesce(LookUp(fxInvLocations, Lower(Title) = lx || Lower(HqName) = lx).Title, Trim(If(IsBlank(iL), "", IfError(Trim(Index(c, iL).Value), "")))))), HqLoc: "",
                                                                            Purchase: With({d: If(IsBlank(iP), "", IfError(Trim(Index(c, iP).Value), ""))}, If(IsBlank(d), "", IfError(Text(DateValue(d), "yyyy-mm-dd"), "bad"))), Warranty: With({d: If(IsBlank(iW), "", IfError(Trim(Index(c, iW).Value), ""))}, If(IsBlank(d), "", IfError(Text(DateValue(d), "yyyy-mm-dd"), "bad"))), Notes: If(IsBlank(iN), "", IfError(Trim(Index(c, iN).Value), "")), Source: "the import template"
                                                                        }
                                                                    )
                                                                )
                                                            )), !IsBlank(Trim(Tag & Serial))),
                                                                        tags: ForAll(gblInvAssets, {V: Lower(Title)}),
                                                                        sers: ForAll(Filter(gblInvAssets, !IsBlank(SerialNumber)), {V: Lower(SerialNumber)}),
                                                                        locs: ForAll(fxInvLocations, {V: Lower(Title)})
                                                                    },
                                                                    ClearCollect(
                                                                        colInvImp,
                                                                        ForAll(
                                                                            raw As r,
                                                                            Patch(
                                                                                r,
                                                                                {
                                                                                    Result: "", Message: "",
                                                                                    Issue: Coalesce(
                                                                                        If(IsBlank(r.Tag), "No asset tag"),
                                                                                        If(!(r.Dept in ["AV", "IT"]), If(hq, "Not on the TSOS or TSAV account", "Department must be AV or IT")),
                                                                                        If(!fxCanManage(r.Dept), "Not your department"),
                                                                                        If(Lower(r.Tag) in tags.V || (!IsBlank(r.Serial) && Lower(r.Serial) in sers.V), "Already in inventory"),
                                                                                        If(CountRows(Filter(raw, Lower(Tag) = Lower(r.Tag) && Row < r.Row)) > 0, "Listed twice"),
                                                                                        If(!(r.Kind in ["Tracked Asset", "Loaner Pool", "Installed in Room"]), "Kind must be Tracked Asset, Loaner Pool or Installed in Room"),
                                                                                        If(!IsBlank(r.Loc) && !(Lower(r.Loc) in locs.V), "Unknown location " & r.Loc & ". Add it under Locations first"),
                                                                                        If(r.Purchase = "bad" || r.Warranty = "bad", "Date not recognized")
                                                                                    )
                                                                                }
                                                                            )
                                                                        )
                                                                    );
                                                                    UpdateContext({locImpDone: true})
                                                                )
                                                            )
                                                        )
                                                    )
                                                )
                                            )
                                          Text: ="Preview"
                                          Width: =130
                        - conInvImpRows:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =20 + 48 + 12 + 40 + 12 + Max(24, galInvImpRows.Height) + 24
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =20
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Visible: =locImpDone
                            Children:
                              - conInvImpRowsHead:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvImpRowsTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =16
                                          Text: ="Preview (" & CountRows(colInvImp) & " rows)"
                                    - txtInvImpRowsDesc:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="Skipped rows show why. Click a kind to switch Tracked Asset / Loaner Pool."
                                          Wrap: =false
                              - conInvImpGo:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvImpSum:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          FillPortions: =1
                                          Height: =36
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: |-
                                            =CountRows(Filter(colInvImp, IsBlank(Issue) && IsBlank(Result))) & " ready  ·  " & CountRows(Filter(colInvImp, !IsBlank(Issue))) & " will be skipped" & With({n: CountRows(Filter(colInvImp, Result = "Imported"))}, If(n > 0, "  ·  " & n & " imported", ""))
                                          Wrap: =false
                                    - btnInvImpImport:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Import the ready rows"
                                          DisplayMode: =If(locBusy || IsEmpty(Filter(colInvImp, IsBlank(Issue) && IsBlank(Result))), DisplayMode.Disabled, DisplayMode.Edit)
                                          Height: =36
                                          Icon: ="Upload"
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({locBusy: true});
                                            // One flow call per batch of 20; all results are gathered first, then applied to the preview in a single update.
                                            With(
                                                {ready: Sort(Filter(colInvImp, IsBlank(Issue) && Result <> "Imported"), Row)},
                                                With(
                                                    {res: Ungroup(
                                                        ForAll(
                                                            Sequence(RoundUp(CountRows(ready) / 20, 0)) As b,
                                                            With(
                                                                {batch: LastN(FirstN(ready, b.Value * 20), Min(20, CountRows(ready) - (b.Value - 1) * 20))},
                                                                {
                                                                    Rows: IfError(
                                                                        With(
                                                                            {raw: ParseJSON(With({invPl: JSON({
                                                                                actionVersion: fxInvActionVersion, action: "AssetImport",
                                                                                rows: ForAll(batch, {row: Row, tag: Tag, serial: Serial, make: Make, model: Model, department: Dept, kind: Kind, homeLocation: Loc, purchaseDate: Purchase, warrantyEnd: Warranty, notes: Notes, source: Source})
                                                                            })}, Switch(fxInvFlowFor(Text(ParseJSON(invPl).action)), "Requests", 'Inventory-Requests'.Run(invPl), "Checkout", 'Inventory-Checkout'.Run(invPl), 'Inventory-Assets'.Run(invPl))).response)},
                                                                            If(
                                                                                Text(raw.status) = "Success",
                                                                                ForAll(Table(raw.results) As res, {Row: Value(res.Value.row), Status: Text(res.Value.status), Message: Text(res.Value.message)}),
                                                                                ForAll(batch As f, {Row: f.Row, Status: "Skipped", Message: Text(raw.message)})
                                                                            )
                                                                        ),
                                                                        ForAll(batch As f, {Row: f.Row, Status: "Failed", Message: "The inventory service could not be reached. Try again."})
                                                                    )
                                                                }
                                                            )
                                                        ),
                                                        Rows
                                                    )},
                                                    UpdateIf(colInvImp, Row in res.Row, {Result: LookUp(res As rr, rr.Row = Row).Status, Message: LookUp(res As rr, rr.Row = Row).Message})
                                                )
                                            );
                                            UpdateContext({locBusy: false});
                                            Notify(CountRows(Filter(colInvImp, Result = "Imported")) & " imported, " & CountRows(Filter(colInvImp, !IsBlank(Issue) || Result in ["Skipped", "Failed"])) & " skipped.", If(IsEmpty(Filter(colInvImp, Result = "Failed")), NotificationType.Success, NotificationType.Warning));
                                            Set(gblInvLoadedAt, Blank());
                                            Select(btnInvImpReload)
                                          Text: =If(locBusy, "Importing…", "Import " & CountRows(Filter(colInvImp, IsBlank(Issue) && IsBlank(Result))) & " assets")
                                          Width: =200
                              - galInvImpRows:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Rows to import"
                                    FillPortions: =0
                                    Height: =Self.AllItemsCount * 56
                                    Items: =Sort(colInvImp, Row)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    ShowScrollbar: =false
                                    TabIndex: =0
                                    TemplatePadding: =0
                                    TemplateSize: =56
                                  Children:
                                    - conInvImpRow:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(225, 228, 232, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Height: =Parent.TemplateHeight - 4
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =10
                                          PaddingLeft: =10
                                          PaddingRight: =8
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Width: =Parent.TemplateWidth
                                        Children:
                                          - conInvImpAccent:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =If(ThisItem.Result = "Imported", RGBA(16, 110, 16, 1), !IsBlank(ThisItem.Issue) || ThisItem.Result in ["Skipped", "Failed"], RGBA(164, 38, 44, 1), RGBA(15, 76, 129, 1))
                                                FillPortions: =0
                                                Height: =32
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Width: =4
                                          - conInvImpRowText:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =50
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutJustifyContent: =LayoutJustifyContent.Center
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - txtInvImpL1:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =RGBA(36, 36, 36, 1)
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingTop: =0
                                                      Size: =12
                                                      Text: =ThisItem.Row & ".  " & Coalesce(ThisItem.Tag, "(no tag)") & If(IsBlank(Trim(ThisItem.Make & ThisItem.Model)), "", "  ·  " & Trim(ThisItem.Make & " " & ThisItem.Model)) & "  ·  " & ThisItem.Dept & If(IsBlank(ThisItem.Loc), If(IsBlank(ThisItem.HqLoc), "", "  ·  HQ location " & ThisItem.HqLoc & " (no match)"), "  ·  " & ThisItem.Loc)
                                                      Wrap: =false
                                                - txtInvImpL2:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =If(ThisItem.Result = "Imported", RGBA(16, 110, 16, 1), !IsBlank(ThisItem.Issue) || ThisItem.Result in ["Skipped", "Failed"], RGBA(164, 38, 44, 1), RGBA(15, 76, 129, 1))
                                                      Height: =20
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingTop: =0
                                                      Size: =11
                                                      Text: |-
                                                        =If(!IsBlank(ThisItem.Issue), "Skipped: " & ThisItem.Issue, ThisItem.Result = "Imported", "Imported", !IsBlank(ThisItem.Result), ThisItem.Result & ": " & ThisItem.Message, "Ready")
                                                      Wrap: =false
                                          - btnInvImpKind:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Switch kind for " & ThisItem.Tag
                                                Appearance: =ButtonAppearance.Secondary
                                                DisplayMode: =If(IsBlank(ThisItem.Issue) && IsBlank(ThisItem.Result) && !locBusy, DisplayMode.Edit, DisplayMode.Disabled)
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =Patch(colInvImp, ThisItem, {Kind: If(ThisItem.Kind = "Tracked Asset", "Loaner Pool", "Tracked Asset")})
                                                Text: =ThisItem.Kind
                                                Width: =140
                        - txtInvImpNoAccess:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Color: =RGBA(164, 38, 44, 1)
                              Fill: =RGBA(253, 231, 233, 1)
                              Height: =48
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =14
                              Text: ="Importing is for AV and IT inventory staff."
                              Visible: =!fxIsInvStaff
