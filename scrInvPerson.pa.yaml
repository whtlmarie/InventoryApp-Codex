                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =20
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Visible: =!IsBlank(gblInvPersonEmail)
                            Children:
                              - conInvPerHistHead:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvPerHistTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =16
                                          Text: ="History"
                                    - txtInvPerHistDesc:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="Items this person has returned or that were reported lost."
                                          Wrap: =false
                              - txtInvPerHistEmpty:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(97, 97, 97, 1)
                                    Height: =24
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="No past items."
                                    Visible: =galInvPerHist.AllItemsCount = 0
                                    Wrap: =false
                              - galInvPerHist:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Past items"
                                    FillPortions: =0
                                    Height: =Min(Self.AllItemsCount, 20) * 52
                                    Items: =Filter(locPerItems, !(Status in ["Active", "Awaiting Acknowledgement", "Return Required"]))
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    ShowScrollbar: =false
                                    TabIndex: =0
                                    TemplatePadding: =0
                                    TemplateSize: =52
                                  Children:
                                    - conInvPerHistRow:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =Parent.TemplateHeight - 4
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Center
                                          Width: =Parent.TemplateWidth
                                        Children:
                                          - txtInvPerHistWhat:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Color: =RGBA(36, 36, 36, 1)
                                                Height: =20
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =ThisItem.'Asset Tag Snapshot' & "  ·  " & ThisItem.Desc & "  ·  " & ThisItem.Status
                                                Wrap: =false
                                          - txtInvPerHistWhen:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Color: =RGBA(97, 97, 97, 1)
                                                Height: =20
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingTop: =0
                                                Size: =12
                                                Text: ="Issued " & Text(ThisItem.'Issued Date', "mmm d, yyyy") & If(IsBlank(ThisItem.'Returned Date'), "", "  ·  returned " & Text(ThisItem.'Returned Date', "mmm d, yyyy") & If(IsBlank(ThisItem.'Return Condition'.Value), "", " (" & ThisItem.'Return Condition'.Value & ")")) & "  ·  " & ThisItem.'Receipt Number'
                                                Wrap: =false
                        - txtInvPerNoAccess:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Color: =RGBA(164, 38, 44, 1)
                              Fill: =RGBA(253, 231, 233, 1)
                              Height: =48
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =14
                              Text: ="This screen is for AV and IT inventory staff."
                              Visible: =!fxCanViewInventory
