Screens:
  scrInvPerson:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
      LoadingSpinnerColor: =RGBA(15, 76, 129, 1)
      OnVisible: |-
        =// Opened from the Personnel Hub ("Open in Inventory"): show that person once (Param person = work email, name).
        If(
            !IsBlank(Param("person")) && !Coalesce(gblInvParamUsed, false),
            Set(gblInvParamUsed, true);
            Set(gblInvPersonEmail, Lower(Trim(Param("person"))));
            Set(gblInvPersonName, Coalesce(Param("name"), Param("person")))
        );
        UpdateContext({locScanMsg: "", locScanMatches: Blank(), locBusy: false, locPerSel: Blank(), locPerRcpt: Blank(), locPerConfirmAll: false});
        If(IsBlank(gblInvLoadedAt) || DateDiff(gblInvLoadedAt, Now(), TimeUnit.Minutes) >= 2, Select(btnInvPerReload));
        Select(btnInvPerLoad)
    Children:
      - conInvPerRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conInvPerHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(15, 76, 129, 1)
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =56
                  LayoutMinWidth: =0
                  PaddingLeft: =8
                  PaddingRight: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnInvPerNavToggle:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        Icon: ="Navigation"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinWidth: =40
                        OnSelect: =Set(varNavCollapsed, !varNavCollapsed)
                        Text: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Tooltip: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Width: =40
                  - txtInvPerAppTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Inventory"
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinWidth: =120
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Inventory"
                        Wrap: =false
                  - txtInvPerUserName:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Signed in as " & User().FullName
                        Align: =Align.Right
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =User().FullName
                        Visible: =App.Width >= 640
                        Width: =240
                        Wrap: =false
            - conInvPerBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conInvPerNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(varNavCollapsed, 56, 240)
                      Children:
                        - galInvPerNav:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Main navigation"
                              FillPortions: =0
                              Height: =CountRows(fxInvVisibleNav) * 46
                              Items: =fxInvVisibleNav
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TabIndex: =0
                              TemplatePadding: =2
                              TemplateSize: =44
                            Children:
                              - conInvPerNavRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.Id = "person", RGBA(230, 240, 250, 1), RGBA(0, 0, 0, 0))
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - btnInvPerNavItem:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =ThisItem.Label
                                          Align: =If(varNavCollapsed, Align.Center, Align.Left)
                                          Appearance: =ButtonAppearance.Subtle
                                          Color: =If(ThisItem.Id = "person", RGBA(15, 76, 129, 1), RGBA(36, 36, 36, 1))
                                          FillPortions: =1
                                          FontWeight: =If(ThisItem.Id = "person", FontWeight.Semibold, FontWeight.Normal)
                                          Height: =40
                                          Icon: =ThisItem.Icon
                                          IconStyle: =If(ThisItem.Id = "person", IconStyle.Filled, IconStyle.Outline)
                                          Layout: =If(varNavCollapsed, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                                          LayoutMinWidth: =40
                                          OnSelect: =Navigate(ThisItem.Target, ScreenTransition.None)
                                          Text: =ThisItem.Label
                                          Tooltip: =ThisItem.Label
                  - conInvPerMain:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =If(App.Width >= 800, 32, 16)
                        PaddingRight: =If(App.Width >= 800, 32, 16)
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnInvPerReload:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Reload inventory data"
                              Height: =36
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =// Inventory data for all screens (whole lists; fine at the current volume).
                                Set(gblInvLoading, true);
                                Refresh(InventoryAssets);
                                Refresh(InventoryCheckouts);
                                Refresh(InventoryReservations);
                                Refresh(InventoryReceipts);
                                Set(gblInvAssets, AddColumns(ForAll(InventoryAssets, ThisRecord), Dept, Department.Value, Status, 'Asset Status'.Value, Kind, 'Asset Kind'.Value));
                                Set(gblInvOpenCheckouts, AddColumns(Filter(InventoryCheckouts, 'Checkout Status'.Value = "Active" || 'Checkout Status'.Value = "Awaiting Acknowledgement" || 'Checkout Status'.Value = "Return Required"), Status, 'Checkout Status'.Value));
                                Set(gblInvReserved, Filter(InventoryReservations, 'Reservation Status'.Value = "Reserved"));
                                Set(gblInvLines, Filter(RequestEquipment, 'Needs Inventory Action' = true));
                                Set(gblInvLoadedAt, Now());
                                Set(gblInvLoading, false)
                              Text: ="Reload"
                              Visible: =false
                              Width: =10
                        - btnInvPerLoad:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Load person"
                              Height: =36
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =// One person's checkouts (open and closed) and receipts, newest first.
                                If(
                                    IsBlank(gblInvPersonEmail),
                                    UpdateContext({locPerItems: Blank(), locPerReceipts: Blank()}),
                                    Refresh(InventoryCheckouts); Refresh(InventoryReceipts);
                                    UpdateContext({
                                        locPerItems: AddColumns(
                                            Sort(Filter(InventoryCheckouts, 'Recipient Email' = gblInvPersonEmail), ID, SortOrder.Descending),
                                            Status, 'Checkout Status'.Value,
                                            Kind, 'Checkout Type'.Value,
                                            Desc, With({a: LookUp(gblInvAssets, ID = 'Asset Id')}, Coalesce(a.'Catalog Name Snapshot', "Equipment") & If(IsBlank(Trim(a.Make & a.Model)), "", " - " & Trim(a.Make & " " & a.Model))),
                                            Dept, LookUp(gblInvAssets, ID = 'Asset Id').Dept
                                        ),
                                        locPerReceipts: Sort(Filter(InventoryReceipts, 'Recipient Email' = gblInvPersonEmail), ID, SortOrder.Descending)
                                    })
                                );
                                UpdateContext({locPerSel: Blank(), locPerConfirmAll: false})
                              Text: ="Load"
                              Visible: =false
                              Width: =10
                        - conInvPerPageHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =64
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conInvPerTitles:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvPerPageTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Bold
                                          Height: =36
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =24
                                          Text: ="People"
                                          Wrap: =false
                                    - txtInvPerPageSubtitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="What one person has, their receipts and history."
                                          Wrap: =false
                              - btnInvPerPrint:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Open the printable hand receipt"
                                    Appearance: =ButtonAppearance.Secondary
                                    Height: =36
                                    Icon: ="Print"
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(gblInvHandItems, Filter(locPerItems, Status in ["Active", "Awaiting Acknowledgement", "Return Required"])); Set(gblInvHandPhone, Coalesce(First(Filter(locPerReceipts, !IsBlank('Duty Phone'))).'Duty Phone', "")); Navigate(scrInvHandReceipt, ScreenTransition.None)
                                    Text: ="Hand receipt"
                                    Visible: =!IsBlank(gblInvPersonEmail)
                                    Width: =150
                              - txtInvPerUpdated:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Right
                                    Color: =RGBA(97, 97, 97, 1)
                                    Height: =20
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =If(gblInvLoading, "Loading…", If(IsBlank(gblInvLoadedAt), "", "Updated " & Text(gblInvLoadedAt, "h:mm AM/PM")))
                                    Visible: =App.Width >= 900
                                    Width: =120
                                    Wrap: =false
                              - btnInvPerRefresh:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Refresh"
                                    Appearance: =ButtonAppearance.Secondary
                                    DisplayMode: =If(gblInvLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnInvPerReload)
                                    Text: ="Refresh"
                                    Width: =120
                        - conInvPerFind:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =20 + 48 + 12 + (If(App.Width >= 900, Max(48, (48 + If(IsEmpty(locScanMatches), 0, 8 + CountRows(locScanMatches) * 38) + If(IsBlank(locScanMsg), 0, 4 + 20))), 48 + 16 + (48 + If(IsEmpty(locScanMatches), 0, 8 + CountRows(locScanMatches) * 38) + If(IsBlank(locScanMsg), 0, 4 + 20)))) + 24
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =20
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - conInvPerFindHead:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvPerFindTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =16
                                          Text: ="Find a person"
                                    - txtInvPerFindDesc:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="Search by name, or scan any item they have."
                                          Wrap: =false
                              - conInvPerFindRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =If(App.Width >= 900, Max(48, (48 + If(IsEmpty(locScanMatches), 0, 8 + CountRows(locScanMatches) * 38) + If(IsBlank(locScanMsg), 0, 4 + 20))), 48 + 16 + (48 + If(IsEmpty(locScanMatches), 0, 8 + CountRows(locScanMatches) * 38) + If(IsBlank(locScanMsg), 0, 4 + 20)))
                                    LayoutAlignItems: =If(App.Width >= 900, LayoutAlignItems.Start, LayoutAlignItems.Stretch)
                                    LayoutDirection: =If(App.Width >= 900, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - cmbInvPerPerson:
                                        Control: ModernCombobox
                                        Properties:
                                          AccessibleLabel: ="Person"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =Appearance.Outline
                                          DelayOutput: =true
                                          FillPortions: =1
                                          Height: =44
                                          InputTextPlaceholder: ="Search by name or email"
                                          ItemDisplayText: =ThisItem.DisplayName & "  (" & ThisItem.Mail & ")"
                                          Items: |-
                                            =If(
                                                Len(Trim(cmbInvPerPerson.SearchText)) >= 2,
                                                Filter(
                                                    Office365Users.SearchUserV2({searchTerm: Trim(cmbInvPerPerson.SearchText), top: 15, isSearchTermRequired: true}).value,
                                                    AccountEnabled && !IsBlank(Mail)
                                                )
                                            )
                                          LayoutMinWidth: =200
                                          OnChange: =If(!IsBlank(Self.Selected), Set(gblInvPersonEmail, Lower(Self.Selected.Mail)); Set(gblInvPersonName, Self.Selected.DisplayName); Select(btnInvPerLoad))
                                          SelectMultiple: =false
                                          Width: =Parent.Width
                                    - conInvPerScanWrap:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =(48 + If(IsEmpty(locScanMatches), 0, 8 + CountRows(locScanMatches) * 38) + If(IsBlank(locScanMsg), 0, 4 + 20))
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =200
                                        Children:
                                          - conInvPerScan:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =48 + If(IsEmpty(locScanMatches), 0, 8 + CountRows(locScanMatches) * 38) + If(IsBlank(locScanMsg), 0, 4 + 20)
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingRight: =2
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                              Children:
                                                - conInvPerScanRow:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      BorderColor: =RGBA(15, 76, 129, 1)
                                                      BorderThickness: =2
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(255, 255, 255, 1)
                                                      FillPortions: =0
                                                      Height: =48
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =8
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingLeft: =12
                                                      PaddingRight: =4
                                                      RadiusBottomLeft: =6
                                                      RadiusBottomRight: =6
                                                      RadiusTopLeft: =6
                                                      RadiusTopRight: =6
                                                    Children:
                                                      - imgInvPerScan:
                                                          Control: Image
                                                          Properties:
                                                            AccessibleLabel: ="Barcode"
                                                            Height: =28
                                                            Image: ="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2028%22%3E%3Cg%20fill%3D%22%230f4c81%22%3E%3Crect%20x%3D%221%22%20y%3D%222%22%20width%3D%222%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%222%22%20width%3D%223%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%222%22%20width%3D%222%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2215%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%222%22%20width%3D%223%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2221%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2223%22%20y%3D%222%22%20width%3D%222%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2226%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2228%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2230%22%20y%3D%222%22%20width%3D%223%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2234%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2236%22%20y%3D%222%22%20width%3D%223%22%20height%3D%2224%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"
                                                            Width: =40
                                                      - txtInvPerScan:
                                                          Control: Classic/TextInput
                                                          Properties:
                                                            AccessibleLabel: ="Scan, or type part of a tag / serial they have"
                                                            BorderStyle: =BorderStyle.None
                                                            BorderThickness: =0
                                                            Default: =""
                                                            FillPortions: =1
                                                            FocusedBorderThickness: =0
                                                            HintText: ="Scan, or type part of a tag / serial they have"
                                                            LayoutMinWidth: =100
                                                            OnChange: |-
                                                              =With(
                                                                  {code: Lower(Trim(Self.Text))},
                                                                  If(
                                                                      !IsBlank(code),
                                                                      With(
                                                                          {exact: Coalesce(LookUp(gblInvAssets, Lower('Asset Tag') = code), LookUp(gblInvAssets, Lower(Coalesce('Serial Number', "")) = code))},
                                                                          If(
                                                                              !IsBlank(exact),
                                                                              UpdateContext({locScanMsg: "", locScanMatches: Blank()});
                                                                              With({hit: exact}, If(
                                                                  IsBlank(hit.'Current Holder Email'),
                                                                  UpdateContext({locScanMsg: hit.'Asset Tag' & " is not checked out to anyone."}),
                                                                  Set(gblInvPersonEmail, Lower(hit.'Current Holder Email')); Set(gblInvPersonName, hit.'Current Holder Name'); Select(btnInvPerLoad)
                                                              )),
                                                                              With(
                                                                                  {m: FirstN(SortByColumns(Filter(gblInvAssets, code in Lower('Asset Tag') || code in Lower(Coalesce('Serial Number', ""))), "Title"), 6)},
                                                                                  If(
                                                                                      IsEmpty(m), UpdateContext({locScanMsg: "No asset tag or serial number contains " & Trim(Self.Text) & ".", locScanMatches: Blank()}),
                                                                                      CountRows(m) = 1, UpdateContext({locScanMsg: "", locScanMatches: Blank()}); With({hit: First(m)}, If(
                                                                  IsBlank(hit.'Current Holder Email'),
                                                                  UpdateContext({locScanMsg: hit.'Asset Tag' & " is not checked out to anyone."}),
                                                                  Set(gblInvPersonEmail, Lower(hit.'Current Holder Email')); Set(gblInvPersonName, hit.'Current Holder Name'); Select(btnInvPerLoad)
                                                              )),
                                                                                      UpdateContext({locScanMsg: "", locScanMatches: m})
                                                                                  )
                                                                              )
                                                                          )
                                                                      )
                                                                  )
                                                              );
                                                              Reset(txtInvPerScan);
                                                              SetFocus(txtInvPerScan)
                                                            PaddingLeft: =6
                                                            Size: =14
                                                - galInvPerScanPick:
                                                    Control: Gallery
                                                    Variant: Vertical
                                                    Properties:
                                                      AccessibleLabel: ="Matching assets"
                                                      FillPortions: =0
                                                      Height: =If(IsEmpty(locScanMatches), 0, 8 + CountRows(locScanMatches) * 38)
                                                      Items: =locScanMatches
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      ShowScrollbar: =false
                                                      TabIndex: =0
                                                      TemplatePadding: =2
                                                      TemplateSize: =34
                                                      Visible: =!IsEmpty(locScanMatches)
                                                    Children:
                                                      - btnInvPerScanPick:
                                                          Control: ModernButton
                                                          Properties:
                                                            AccessibleLabel: ="Use " & ThisItem.'Asset Tag'
                                                            Align: =Align.Left
                                                            Appearance: =ButtonAppearance.Secondary
                                                            Height: =34
                                                            Icon: ="ChevronRight"
                                                            Layout: =ButtonLayout.IconAfter
                                                            OnSelect: |-
                                                              =UpdateContext({locScanMatches: Blank(), locScanMsg: ""}); With({hit: ThisItem}, If(
                                                                  IsBlank(hit.'Current Holder Email'),
                                                                  UpdateContext({locScanMsg: hit.'Asset Tag' & " is not checked out to anyone."}),
                                                                  Set(gblInvPersonEmail, Lower(hit.'Current Holder Email')); Set(gblInvPersonName, hit.'Current Holder Name'); Select(btnInvPerLoad)
                                                              ))
                                                            Text: =ThisItem.'Asset Tag' & "   ·   " & Coalesce(ThisItem.'Catalog Name Snapshot', "Equipment") & "   ·   " & ThisItem.Status
                                                            Width: =Parent.TemplateWidth - 4
                                                - txtInvPerScanMsg:
                                                    Control: ModernText
