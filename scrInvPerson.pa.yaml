                                                              {r1: ParseJSON(With({invPl: fxInvReturnPayload(sel.ID, "Good", "Transferred to " & who.DisplayName & ".")}, Switch(fxInvFlowFor(Text(ParseJSON(invPl).action)), "Requests", 'Inventory-Requests'.Run(invPl), "Checkout", 'Inventory-Checkout'.Run(invPl), 'Inventory-Assets'.Run(invPl))).response)},
                                                              If(
                                                                  Text(r1.status) <> "Success",
                                                                  UpdateContext({locResult: {Status: "Failed", Message: Text(r1.message)}}),
                                                                  With(
                                                                      {st: ParseJSON(With({invPl: fxInvStartReceiptPayload(Lower(who.Mail), who.DisplayName, "i:0#.f|membership|" & Lower(who.UserPrincipalName), Coalesce(First(who.BusinessPhones).Value, who.mobilePhone, ""), "", If(drpInvPerXferType.Selected.Value = "Long-term Assignment", "", Text(dteInvPerXferDue.SelectedDate, "yyyy-mm-dd")), drpInvPerXferType.Selected.Value, sel.Dept, "Electronic")}, Switch(fxInvFlowFor(Text(ParseJSON(invPl).action)), "Requests", 'Inventory-Requests'.Run(invPl), "Checkout", 'Inventory-Checkout'.Run(invPl), 'Inventory-Assets'.Run(invPl))).response)},
                                                                      If(
                                                                          Text(st.status) <> "Success",
