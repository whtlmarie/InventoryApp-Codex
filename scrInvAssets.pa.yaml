Screens:
  scrInvAssets:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
      LoadingSpinnerColor: =RGBA(15, 76, 129, 1)
      OnVisible: |-
        =UpdateContext({locAstDept: Coalesce(locAstDept, fxDefaultDept), locAstStatus: Coalesce(locAstStatus, "All"), locScanMsg: "", locScanMatches: Blank()});
        If((IsBlank(gblInvLoadedAt) || DateDiff(gblInvLoadedAt, Now(), TimeUnit.Minutes) >= 2), Select(btnInvAstReload));
        SetFocus(txtInvAstScan)
    Children:
      - conInvAstRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conInvAstHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(15, 76, 129, 1)
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =56
                  LayoutMinWidth: =0
                  PaddingLeft: =8
                  PaddingRight: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnInvAstNavToggle:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        Icon: ="Navigation"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinWidth: =40
                        OnSelect: =Set(varNavCollapsed, !varNavCollapsed)
                        Text: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Tooltip: =If(varNavCollapsed, "Expand navigation", "Collapse navigation")
                        Width: =40
                  - txtInvAstAppTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Inventory"
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinWidth: =120
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Inventory"
                        Wrap: =false
                  - txtInvAstUserName:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Signed in as " & User().FullName
                        Align: =Align.Right
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =User().FullName
                        Visible: =App.Width >= 640
                        Width: =240
                        Wrap: =false
            - conInvAstBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conInvAstNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(varNavCollapsed, 56, 240)
                      Children:
                        - galInvAstNav:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Main navigation"
                              FillPortions: =0
                              Height: =CountRows(fxInvVisibleNav) * 46
                              Items: =fxInvVisibleNav
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TabIndex: =0
                              TemplatePadding: =2
                              TemplateSize: =44
                            Children:
                              - conInvAstNavRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.Id = "assets", RGBA(230, 240, 250, 1), RGBA(0, 0, 0, 0))
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - btnInvAstNavItem:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =ThisItem.Label
                                          Align: =If(varNavCollapsed, Align.Center, Align.Left)
                                          Appearance: =ButtonAppearance.Subtle
                                          Color: =If(ThisItem.Id = "assets", RGBA(15, 76, 129, 1), RGBA(36, 36, 36, 1))
                                          FillPortions: =1
                                          FontWeight: =If(ThisItem.Id = "assets", FontWeight.Semibold, FontWeight.Normal)
                                          Height: =40
                                          Icon: =ThisItem.Icon
                                          IconStyle: =If(ThisItem.Id = "assets", IconStyle.Filled, IconStyle.Outline)
                                          Layout: =If(varNavCollapsed, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                                          LayoutMinWidth: =40
                                          OnSelect: =Navigate(ThisItem.Target, ScreenTransition.None)
                                          Text: =ThisItem.Label
                                          Tooltip: =ThisItem.Label
                  - conInvAstMain:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =If(App.Width >= 800, 32, 16)
                        PaddingRight: =If(App.Width >= 800, 32, 16)
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnInvAstReload:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Reload inventory data"
                              Height: =36
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =// Inventory data for all screens (whole lists; fine at the current volume).
                                Set(gblInvLoading, true);
                                Refresh(InventoryAssets);
                                Refresh(InventoryCheckouts);
                                Refresh(InventoryReservations);
                                Refresh(InventoryReceipts);
                                Set(gblInvAssets, AddColumns(ForAll(InventoryAssets, ThisRecord), Dept, Department.Value, Status, AssetStatus.Value, Kind, AssetKind.Value));
                                Set(gblInvOpenCheckouts, AddColumns(Filter(InventoryCheckouts, CheckoutStatus.Value = "Active" || CheckoutStatus.Value = "Awaiting Acknowledgement" || CheckoutStatus.Value = "Return Required"), Status, CheckoutStatus.Value));
                                Set(gblInvReserved, Filter(InventoryReservations, ReservationStatus.Value = "Reserved"));
                                Set(gblInvLines, Filter(RequestEquipment, NeedsInventoryAction = true));
                                Set(gblInvLoadedAt, Now());
                                Set(gblInvLoading, false)
                              Text: ="Reload"
                              Visible: =false
                              Width: =10
                        - conInvAstPageHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =64
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conInvAstTitles:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvAstPageTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Bold
                                          Height: =36
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =24
                                          Text: ="Assets"
                                          Wrap: =false
                                    - txtInvAstPageSubtitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="Every tracked unit. Scan a label to open it."
                                          Wrap: =false
                              - btnInvAstAdd:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Add an asset"
                                    Height: =36
                                    Icon: ="Add"
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(gblInvAssetId, 0); Navigate(scrInvAsset, ScreenTransition.None)
                                    Text: ="Add asset"
                                    Visible: =fxIsInvStaff
                                    Width: =140
                              - txtInvAstUpdated:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Right
                                    Color: =RGBA(97, 97, 97, 1)
                                    Height: =20
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =If(gblInvLoading, "Loading…", If(IsBlank(gblInvLoadedAt), "", "Updated " & Text(gblInvLoadedAt, "h:mm AM/PM")))
                                    Visible: =App.Width >= 900
                                    Width: =120
                                    Wrap: =false
                              - btnInvAstRefresh:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Refresh"
                                    Appearance: =ButtonAppearance.Secondary
                                    DisplayMode: =If(gblInvLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnInvAstReload)
                                    Text: ="Refresh"
                                    Width: =120
                        - conInvAstScan:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =48 + If(IsEmpty(locScanMatches), 0, 8 + CountRows(locScanMatches) * 38) + If(IsBlank(locScanMsg), 0, 4 + 20)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingRight: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - conInvAstScanRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(15, 76, 129, 1)
                                    BorderThickness: =2
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =12
                                    PaddingRight: =4
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                  Children:
                                    - imgInvAstScan:
                                        Control: Image
                                        Properties:
                                          AccessibleLabel: ="Barcode"
                                          Height: =28
                                          Image: ="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2028%22%3E%3Cg%20fill%3D%22%230f4c81%22%3E%3Crect%20x%3D%221%22%20y%3D%222%22%20width%3D%222%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%222%22%20width%3D%223%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%222%22%20width%3D%222%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2215%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%222%22%20width%3D%223%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2221%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2223%22%20y%3D%222%22%20width%3D%222%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2226%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2228%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2230%22%20y%3D%222%22%20width%3D%223%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2234%22%20y%3D%222%22%20width%3D%221%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2236%22%20y%3D%222%22%20width%3D%223%22%20height%3D%2224%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"
                                          Width: =40
                                    - txtInvAstScan:
                                        Control: Classic/TextInput
                                        Properties:
                                          AccessibleLabel: ="Scan, or type all or part of an asset tag / serial number"
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Default: =""
                                          FillPortions: =1
                                          FocusedBorderThickness: =0
                                          HintText: ="Scan, or type all or part of an asset tag / serial number"
                                          LayoutMinWidth: =100
                                          OnChange: |-
                                            =With(
                                                {code: Lower(Trim(Self.Text))},
                                                If(
                                                    !IsBlank(code),
                                                    With(
                                                        {exact: Coalesce(LookUp(gblInvAssets, Lower(Title) = code), LookUp(gblInvAssets, Lower(Coalesce(SerialNumber, "")) = code))},
                                                        If(
                                                            !IsBlank(exact),
                                                            UpdateContext({locScanMsg: "", locScanMatches: Blank()});
                                                            With({hit: exact}, Set(gblInvAssetId, hit.ID); Navigate(scrInvAsset, ScreenTransition.None)),
                                                            With(
                                                                {m: FirstN(SortByColumns(Filter(gblInvAssets, code in Lower(Title) || code in Lower(Coalesce(SerialNumber, ""))), "Title"), 6)},
                                                                If(
                                                                    IsEmpty(m), UpdateContext({locScanMsg: "No asset tag or serial number contains " & Trim(Self.Text) & ".", locScanMatches: Blank()}),
                                                                    CountRows(m) = 1, UpdateContext({locScanMsg: "", locScanMatches: Blank()}); With({hit: First(m)}, Set(gblInvAssetId, hit.ID); Navigate(scrInvAsset, ScreenTransition.None)),
                                                                    UpdateContext({locScanMsg: "", locScanMatches: m})
                                                                )
                                                            )
                                                        )
                                                    )
                                                )
                                            );
                                            Reset(txtInvAstScan);
                                            SetFocus(txtInvAstScan)
                                          PaddingLeft: =6
                                          Size: =14
                              - galInvAstScanPick:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Matching assets"
                                    FillPortions: =0
                                    Height: =If(IsEmpty(locScanMatches), 0, 8 + CountRows(locScanMatches) * 38)
                                    Items: =locScanMatches
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    ShowScrollbar: =false
                                    TabIndex: =0
                                    TemplatePadding: =2
                                    TemplateSize: =34
                                    Visible: =!IsEmpty(locScanMatches)
                                  Children:
                                    - btnInvAstScanPick:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Use " & ThisItem.Title
                                          Align: =Align.Left
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =34
                                          Icon: ="ChevronRight"
                                          Layout: =ButtonLayout.IconAfter
                                          OnSelect: |-
                                            =UpdateContext({locScanMatches: Blank(), locScanMsg: ""}); With({hit: ThisItem}, Set(gblInvAssetId, hit.ID); Navigate(scrInvAsset, ScreenTransition.None))
                                          Text: =ThisItem.Title & "   ·   " & Coalesce(ThisItem.CatalogNameSnapshot, "Equipment") & "   ·   " & ThisItem.Status
                                          Width: =Parent.TemplateWidth - 4
                              - txtInvAstScanMsg:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(164, 38, 44, 1)
                                    Height: =20
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =locScanMsg
                                    Visible: =!IsBlank(locScanMsg)
                                    Wrap: =false
                        - conInvAstFilters:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(App.Width >= 1100, 40, 88)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutWrap: =true
                              Visible: =fxCanViewInventory
                            Children:
                              - galInvAstDept:
                                  Control: Gallery
                                  Variant: Horizontal
                                  Properties:
                                    AccessibleLabel: ="galInvAstDept"
                                    FillPortions: =0
                                    Height: =36
                                    Items: =fxDeptFilters
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    ShowScrollbar: =false
                                    TabIndex: =0
                                    TemplatePadding: =2
                                    TemplateSize: =110
                                    Width: =Self.AllItemsCount * 114
                                  Children:
                                    - btnInvAstDept:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =ThisItem.Label
                                          Appearance: =If(locAstDept = ThisItem.Key, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                          OnSelect: |-
                                            =UpdateContext({locAstDept: ThisItem.Key})
                                          Text: =ThisItem.Label
                                          Width: =Parent.TemplateWidth - 4
                              - drpInvAstStatus:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="Status"
                                    Appearance: =Appearance.Outline
                                    Default: |-
                                      =LookUp(Table({Value: "All"}, {Value: "Available"}, {Value: "Issued"}, {Value: "In Repair"}, {Value: "Lost"}, {Value: "Retired"}), Value = locAstStatus)
                                    Height: =36
                                    ItemDisplayText: =ThisItem.Value
                                    Items: |-
                                      =Table({Value: "All"}, {Value: "Available"}, {Value: "Issued"}, {Value: "In Repair"}, {Value: "Lost"}, {Value: "Retired"})
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =UpdateContext({locAstStatus: Self.Selected.Value})
                                    Width: =180
                              - txtInvAstSearch:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: ="Search assets"
                                    Appearance: =Appearance.Outline
                                    Height: =36
                                    LayoutMinWidth: =0
                                    Placeholder: ="Search tag, serial, make, model, item or holder"
                                    Type: =TextInputType.Search
                                    Width: =360
                        - conInvAstList:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =20 + 48 + 12 + Max(galInvAstList.Height, If(galInvAstList.AllItemsCount = 0, 24, 0)) + 24
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =20
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - conInvAstListHead:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - txtInvAstListTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(36, 36, 36, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =16
                                          Text: ="Assets (" & galInvAstList.AllItemsCount & ")"
                                    - txtInvAstListDesc:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Color: =RGBA(97, 97, 97, 1)
                                          Height: =20
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="Select a row to see details, history and who has it."
                                          Wrap: =false
                              - txtInvAstListEmpty:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(97, 97, 97, 1)
                                    Height: =24
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =If(gblInvLoading, "Loading…", "No assets match. Add one, or change the filters.")
                                    Visible: =galInvAstList.AllItemsCount = 0
                                    Wrap: =false
                              - galInvAstList:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Assets"
                                    FillPortions: =0
                                    Height: =Min(Self.AllItemsCount, 50) * 56
                                    Items: |-
                                      =SortByColumns(
                                          Filter(
                                              gblInvAssets,
                                              (locAstDept = "All" || Dept = locAstDept) &&
                                              (locAstStatus = "All" || Status = locAstStatus) &&
                                              (IsBlank(Trim(txtInvAstSearch.Text)) || Trim(txtInvAstSearch.Text) in Title || Trim(txtInvAstSearch.Text) in SerialNumber || Trim(txtInvAstSearch.Text) in Make || Trim(txtInvAstSearch.Text) in Model ||
                                                  Trim(txtInvAstSearch.Text) in CatalogNameSnapshot || Trim(txtInvAstSearch.Text) in CurrentHolderName)
                                          ),
                                          "Title"
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    ShowScrollbar: =false
                                    TabIndex: =0
                                    TemplatePadding: =0
                                    TemplateSize: =56
                                  Children:
                                    - conInvAstRow:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(225, 228, 232, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Height: =Parent.TemplateHeight - 4
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =12
                                          PaddingLeft: =12
                                          PaddingRight: =4
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Width: =Parent.TemplateWidth
                                        Children:
                                          - txtInvAstTag:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Color: =RGBA(36, 36, 36, 1)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =ThisItem.Title
                                                Width: =140
                                                Wrap: =false
