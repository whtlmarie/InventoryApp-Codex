Screens:
  scrInvReceipt:
    Properties:
      Fill: =RGBA(244, 246, 249, 1)
      OnVisible: |-
        =// gblInvRcId: from Home ("Review and acknowledge"), else the email link (?receipt=<id>).
        If(IsBlank(gblInvRcId) || gblInvRcId = 0, Set(gblInvRcId, IfError(Value(Param("receipt")), 0)));
        UpdateContext({locRcChecked: false, locRcJustDone: false, locRcBusy: false, locRcError: "", locRcPolls: 0, locRcStep: "load"});
        Reset(chkInvRcAgree);
        Select(btnInvRcLoad)
    Children:
      - conInvRcRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 249, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conInvRcBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(11, 42, 74, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =20
                  PaddingRight: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnInvRcBack:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Back to Home"
                        Appearance: =ButtonAppearance.Secondary
                        Height: =36
                        Icon: ="ArrowLeft"
                        LayoutMinWidth: =0
                        OnSelect: =Set(gblInvRcFromHome, false); Set(gblInvRcId, 0); Navigate(scrInvHome, ScreenTransition.None)
                        Text: ="Home"
                        Visible: =gblInvRcFromHome
                        Width: =100
                  - imgInvRcLogo:
                      Control: Image
                      Properties:
                        AccessibleLabel: ="USAF Special Operations School patch"
                        Height: =48
                        Image: =fxUsafsosPatch
                        Width: =48
